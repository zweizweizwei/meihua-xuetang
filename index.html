<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#58CC02">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>多灵国-八卦版</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🌸</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#58CC02;--green-dark:#46A302;--red:#FF4B4B;--bg:#F7F7F7;--card:#fff;--text:#3C3C3C;--text-light:#777;--border:#E5E5E5;--gold:#FFC800;--metal:#FFD700;--wood:#4CAF50;--water:#2196F3;--fire:#FF5722;--earth:#8D6E63}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent;user-select:none}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

/* Header */
.header{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo .icon{font-size:28px}
.streak{display:flex;align-items:center;gap:4px;font-weight:600;font-size:15px;color:var(--gold)}

/* Progress */
.progress-wrap{padding:0 20px 16px}
.progress-bar{height:12px;background:var(--border);border-radius:6px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);border-radius:6px;transition:width .4s ease}
.progress-text{font-size:12px;color:var(--text-light);margin-top:4px;text-align:right}

/* Main */
.main{flex:1;padding:0 20px 20px;display:flex;flex-direction:column;gap:16px}

/* Question card */
.q-card{background:var(--card);border-radius:16px;padding:24px;border:2px solid var(--border);transition:border-color .3s}
.q-card.correct{border-color:var(--green);background:#F0FFE5}
.q-card.wrong{border-color:var(--red);background:#FFF0F0}
.q-prompt{font-size:16px;color:var(--text-light);margin-bottom:16px;line-height:1.5}
.q-target{font-size:42px;text-align:center;margin:12px 0;line-height:1.2}
.q-target-text{font-size:24px;font-weight:700;text-align:center;margin:12px 0}

/* Choices */
.choices{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.choice-btn{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:14px 12px;font-size:15px;cursor:pointer;transition:all .15s;text-align:center;font-weight:500;color:var(--text);min-height:52px;display:flex;align-items:center;justify-content:center;gap:6px}
.choice-btn:active{transform:scale(.97)}
.choice-btn:disabled{cursor:default}
.choice-btn.correct{border-color:var(--green);background:#D7FFB8;color:#3C7A00}
.choice-btn.wrong{border-color:var(--red);background:#FFD4D4;color:#B80000}
.choice-btn.dim{opacity:.5}

/* Feedback */
.feedback{text-align:center;padding:12px;border-radius:12px;font-weight:600;font-size:16px;display:none}
.feedback.show{display:block}
.feedback.correct{background:#D7FFB8;color:#3C7A00}
.feedback.wrong{background:#FFD4D4;color:#B80000}
.feedback .emoji{font-size:28px;display:block;margin-bottom:4px}
.feedback .hint{font-size:13px;font-weight:400;margin-top:4px;opacity:.8}

/* Bottom */
.bottom{padding:12px 20px 20px}
.continue-btn{width:100%;padding:16px;border:none;border-radius:14px;background:var(--green);color:#fff;font-size:17px;font-weight:700;cursor:pointer;transition:all .15s;display:none}
.continue-btn.show{display:block}
.continue-btn:active{transform:scale(.98);background:var(--green-dark)}
.continue-btn.white{background:#fff;color:var(--green);border:2px solid var(--green)}

/* Level complete — 花光共舞 */
#celebration-canvas{position:fixed;inset:0;z-index:9;background:#0d0d12}
.complete-overlay{position:fixed;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;z-index:10;padding:20px;pointer-events:none}
.complete-overlay>*{pointer-events:auto}
.complete-overlay.show{display:flex}
.complete-card{text-align:center;max-width:340px;width:100%;opacity:0;animation:riseIn .9s 1.5s ease-out forwards}
@keyframes riseIn{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:translateY(0)}}
.complete-badge{display:inline-block;padding:6px 24px;border:1px solid rgba(212,175,55,.3);border-radius:20px;font-size:.8rem;letter-spacing:.2em;color:#c4a060;margin-bottom:14px}
.complete-title{font-size:2.2rem;font-weight:300;color:#efe0c8;margin-bottom:4px}
.complete-sub{font-size:.9rem;color:#7a7260;margin-bottom:24px}
.complete-stats{display:flex;gap:28px;justify-content:center;margin-bottom:32px}
.complete-stat{text-align:center}
.complete-stat-val{font-size:1.5rem;font-weight:600;color:#d4b060}
.complete-stat-label{font-size:.7rem;color:#5a5448;letter-spacing:.1em}
.complete-btn{display:inline-block;padding:11px 40px;border:1px solid rgba(212,175,55,.35);border-radius:24px;color:#d4b060;font-size:.95rem;cursor:pointer;transition:all .4s;background:transparent;position:relative;overflow:hidden;margin:6px 8px}
.complete-btn::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(212,175,55,.1) 0%,transparent 70%);opacity:0;transition:opacity .4s}
.complete-btn:hover::after{opacity:1}
.complete-btn:hover{border-color:#d4b060}
.complete-btn.primary{background:rgba(212,175,55,.15);border-color:rgba(212,175,55,.5)}
.complete-warn{background:rgba(255,152,0,.08);border-radius:10px;padding:12px;margin-bottom:16px;border:1px solid rgba(255,152,0,.2)}
.complete-warn-title{font-weight:700;color:#e65100;margin-bottom:4px}
.complete-warn-text{font-size:13px;color:#7a7260}

/* Intro card */
.intro-card{background:var(--card);border-radius:16px;padding:24px;text-align:center;border:2px solid var(--border)}

/* Menu - level cards */
.menu-grid{display:flex;flex-direction:column;gap:12px;padding:16px 0}
.level-card{background:var(--card);border-radius:16px;padding:20px;border:2px solid var(--border);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:16px}
.level-card:active{transform:scale(.98);border-color:var(--green)}
.level-card.locked{opacity:.5;cursor:not-allowed}
.level-card .lc-icon{font-size:40px;min-width:50px;text-align:center}
.level-card .lc-info{flex:1}
.level-card .lc-title{font-weight:700;font-size:17px;margin-bottom:4px}
.level-card .lc-desc{font-size:13px;color:var(--text-light)}
.level-card .lc-badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px}
.level-card .lc-badge.done{background:#D7FFB8;color:#3C7A00}
.level-card .lc-badge.open{background:#FFF3CD;color:#856404}
.lc-detail-btn{font-size:22px;cursor:pointer;padding:4px 8px;border-radius:8px;background:var(--bg);flex-shrink:0;transition:all .15s}
.lc-detail-btn:active{background:#EDE7F6;transform:scale(.9)}

/* Detail page */
.detail-card{background:var(--card);border-radius:16px;padding:24px;border:2px solid var(--border);margin-bottom:16px}
.detail-card h3{font-size:18px;margin-bottom:12px}
.detail-card p{font-size:14px;line-height:1.8;color:var(--text);text-align:left}
.detail-source{background:#FFF8E1;border-radius:12px;padding:16px;border-left:4px solid #FFA000;margin-top:16px}
.detail-source h4{font-size:14px;color:#E65100;margin-bottom:8px}
.detail-source p{font-size:13px;color:#795548;line-height:1.7;font-style:italic}

/* Trigram grid */
.trigram-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.trigram-card{background:var(--bg);border-radius:12px;padding:14px 10px;text-align:center;border-left:4px solid var(--border);display:flex;align-items:center;gap:10px}
.trigram-card .sym{font-size:36px;min-width:44px}
.trigram-card .info{text-align:left;flex:1}
.trigram-card .info .name{font-weight:700;font-size:15px}
.trigram-card .info .wuxing{color:var(--text-light);font-size:12px}
.trigram-card .info .mnemonic{font-size:12px;color:var(--green);font-weight:600;margin-top:2px}
.trigram-card.wx-jin{border-left-color:var(--metal)}
.trigram-card.wx-mu{border-left-color:var(--wood)}
.trigram-card.wx-shui{border-left-color:var(--water)}
.trigram-card.wx-huo{border-left-color:var(--fire)}
.trigram-card.wx-tu{border-left-color:var(--earth)}

/* Wuxing cycle */
.wx-cycle{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;margin:12px 0}
.wx-chip{padding:8px 16px;border-radius:12px;font-weight:700;font-size:16px;color:#fff}
.wx-chip.jin{background:#FFD700;color:#5D4E37}
.wx-chip.mu{background:#4CAF50}
.wx-chip.shui{background:#2196F3}
.wx-chip.huo{background:#FF5722}
.wx-chip.tu{background:#8D6E63}
.wx-arrow{font-size:20px;color:var(--text-light)}

/* Back button */
.back-btn{background:none;border:none;font-size:22px;cursor:pointer;padding:4px 8px;color:var(--text-light)}

/* Review section */
.review-section{background:#FFF9E6;border-radius:12px;padding:14px;border:2px dashed #E6D88A;margin-bottom:4px}
.review-section .rs-title{font-size:13px;font-weight:700;color:#B8860B;margin-bottom:8px;text-align:center}
.review-q{margin-bottom:8px;font-size:14px}
.review-q .rq-prompt{color:var(--text-light);margin-bottom:4px}
.review-q .rq-choices{display:flex;gap:6px;flex-wrap:wrap}

/* Source tag */
.source-tag{font-size:11px;color:var(--text-light);text-align:center;margin-top:8px;font-style:italic;opacity:.7}

/* Tab bar for review */
.review-bar{display:flex;gap:8px;margin-bottom:8px}
.review-bar button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--border);background:var(--card);font-size:14px;font-weight:600;cursor:pointer}
.review-bar button.active{border-color:var(--green);background:#D7FFB8;color:#3C7A00}


/* Streak effects */
.streak-fire{position:fixed;pointer-events:none;z-index:100;font-size:40px;animation:fireUp .8s ease-out forwards}
@keyframes fireUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(1.5)}}
.streak-pulse{animation:cardPulse .5s ease-out}
@keyframes cardPulse{0%{box-shadow:0 0 0 rgba(255,150,0,.6)}100%{box-shadow:0 0 40px rgba(255,150,0,0)}}
.streak-shake{animation:scoreShake .4s ease-out}
@keyframes scoreShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.streak-glow{position:fixed;inset:0;pointer-events:none;z-index:99;animation:edgeGlow .6s ease-out}
@keyframes edgeGlow{0%{box-shadow:inset 0 0 80px rgba(255,120,0,.4)}100%{box-shadow:inset 0 0 0 rgba(255,120,0,0)}}

@media(max-width:380px){
  .trigram-card .sym{font-size:28px;min-width:36px}
  .choices{grid-template-columns:1fr}
  .q-target{font-size:32px}
  .q-target-text{font-size:20px}
  .level-card .lc-icon{font-size:30px;min-width:40px}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>

// ====== AUDIO ======
var AudioCtx = window.AudioContext || window.webkitAudioContext;
var audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
}
function playTone(freq, type, duration, vol) {
  if (!audioCtx) initAudio();
  var now = audioCtx.currentTime;
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.type = type||'sine';
  osc.frequency.setValueAtTime(freq, now);
  gain.gain.setValueAtTime(vol||0.15, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now+duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(now); osc.stop(now+duration);
}
function sfxCorrect(s) {
  var base = 660; if (s >= 3) base = 880; if (s >= 6) base = 1100;
  initAudio(); playTone(base, 'triangle', 0.12, 0.13);
  setTimeout(function() { playTone(base*1.25, 'triangle', 0.12, 0.1); }, 80);
}
function sfxWrong() { initAudio(); playTone(180, 'square', 0.25, 0.08); }
function sfxComplete() {
  initAudio();
  [523, 659, 784].forEach(function(f, i) {
    setTimeout(function() { playTone(f, 'triangle', 0.25, 0.12); }, i * 120);
  });
}

// ====== STREAK EFFECTS ======
function showStreakEffect(s,el){
  if(s<3)return;
  var rect=el.getBoundingClientRect();
  var cx=rect.left+rect.width/2,cy=rect.top;
  var fires=s>=7?3:s>=5?2:1;
  for(var i=0;i<fires;i++){
    var f=document.createElement('div');f.className='streak-fire';
    f.textContent='🔥';f.style.left=(cx-20+i*30-fires*15)+'px';f.style.top=cy+'px';
    document.body.appendChild(f);
    setTimeout(function(){f.remove();},800);
  }
  var card=document.querySelector('.q-card');
  if(card){card.classList.add('streak-pulse');setTimeout(function(){card.classList.remove('streak-pulse')},500);}
  if(s>=5){
    var st=document.querySelector('.streak');
    if(st){st.classList.add('streak-shake');setTimeout(function(){st.classList.remove('streak-shake')},400);}
  }
  if(s>=7){
    var g=document.createElement('div');g.className='streak-glow';
    document.body.appendChild(g);
    setTimeout(function(){g.remove();},600);
  }
}

// ====== DATA ======
var TRIGRAMS = {
  qian:{sym:'☰',name:'乾',wuxing:'金',nature:'天',mnemonic:'乾三连',family:'父',animal:'马',body:'首',dir:'西北'},
  dui:{sym:'☱',name:'兑',wuxing:'金',nature:'泽',mnemonic:'兑上缺',family:'少女',animal:'羊',body:'口',dir:'西'},
  li:{sym:'☲',name:'离',wuxing:'火',nature:'火',mnemonic:'离中虚',family:'中女',animal:'雉',body:'目',dir:'南'},
  zhen:{sym:'☳',name:'震',wuxing:'木',nature:'雷',mnemonic:'震仰盂',family:'长男',animal:'龙',body:'足',dir:'东'},
  xun:{sym:'☴',name:'巽',wuxing:'木',nature:'风',mnemonic:'巽下断',family:'长女',animal:'鸡',body:'股',dir:'东南'},
  kan:{sym:'☵',name:'坎',wuxing:'水',nature:'水',mnemonic:'坎中满',family:'中男',animal:'豕',body:'耳',dir:'北'},
  gen:{sym:'☶',name:'艮',wuxing:'土',nature:'山',mnemonic:'艮覆碗',family:'少男',animal:'狗',body:'手',dir:'东北'},
  kun:{sym:'☷',name:'坤',wuxing:'土',nature:'地',mnemonic:'坤六断',family:'母',animal:'牛',body:'腹',dir:'西南'}
};

var WUXING = {
  mu:{name:'木',sheng:'huo',ke:'tu',dir:'东',season:'春',color:'青',organ:'肝',taste:'酸',emotion:'怒'},
  huo:{name:'火',sheng:'tu',ke:'jin',dir:'南',season:'夏',color:'赤',organ:'心',taste:'苦',emotion:'喜'},
  tu:{name:'土',sheng:'jin',ke:'shui',dir:'中',season:'长夏',color:'黄',organ:'脾',taste:'甘',emotion:'思'},
  jin:{name:'金',sheng:'shui',ke:'mu',dir:'西',season:'秋',color:'白',organ:'肺',taste:'辛',emotion:'悲'},
  shui:{name:'水',sheng:'mu',ke:'huo',dir:'北',season:'冬',color:'黑',organ:'肾',taste:'咸',emotion:'恐'}
};
var WX_ORDER = ['mu','huo','tu','jin','shui'];

var LEVELS = [];

// ==== LEVEL 0: 测试关 ====
LEVELS.push({
  id:0, icon:'🧪', title:'快速测试', desc:'5道题快速验证功能，不计入进度',
  source:'测试专用',
  reviewCount:0,
  teaching:function(main){
    main.appendChild(h('div',{className:'intro-card'},
      h('h2',{},'🧪 第0关：快速测试'),
      h('p',{style:{fontSize:'14px',color:'var(--text-light)',lineHeight:'1.6'}},
        '5道基础八卦题，用来测试音效、连击动效等功能。不计入成绩，随便玩～'),
      h('p',{style:{marginTop:'12px',fontSize:'13px',color:'var(--text-light)'}},'👇 准备好了就开始')
    ));
  },
  questions:[
    {prompt:'这是什么卦？',type:'sym-name',sym:'qian',choices:['乾','坤','震','巽'],answer:0},
    {prompt:'识别这个卦',type:'sym-name',sym:'li',choices:['离','坎','震','兑'],answer:0},
    {prompt:'这是什么卦？',type:'sym-name',sym:'kun',choices:['乾','坤','艮','兑'],answer:1},
    {prompt:'识别这个卦',type:'sym-name',sym:'kan',choices:['离','坎','艮','巽'],answer:1},
    {prompt:'这是什么卦？',type:'sym-name',sym:'zhen',choices:['震','兑','离','乾'],answer:0},
    {prompt:'识别这个卦',type:'sym-name',sym:'dui',choices:['艮','兑','乾','坤'],answer:1},
    {prompt:'这是什么卦？',type:'sym-name',sym:'xun',choices:['震','离','巽','坎'],answer:2},
    {prompt:'识别这个卦',type:'sym-name',sym:'gen',choices:['艮','兑','震','离'],answer:0}
  ]
});

// ==== LEVEL 1: 八卦入门 ====
LEVELS.push({
  id:1, icon:'☰', title:'八卦入门', desc:'认识八个卦象的符号、名称和五行',
  source:'《周易·说卦传》',
  reviewCount:0,
  teaching:function(main){
    main.appendChild(h('div',{className:'intro-card'},
      h('h2',{},'☰ 第1关：八卦入门'),
      h('p',{style:{fontSize:'14px',color:'var(--text-light)',marginBottom:'12px',lineHeight:'1.6'}},
        '八卦由阳爻（⚊）和阴爻（⚋）三层叠加而成，共八种组合，分别对应自然界的八种基本现象。'),
      h('div',{style:{background:'#FFF9E6',borderRadius:'10px',padding:'12px 14px',marginBottom:'12px',textAlign:'center'}},
        h('div',{style:{fontWeight:700,fontSize:'14px',marginBottom:'6px',color:'#B8860B'}},'📝 八卦取象口诀'),
        h('div',{style:{fontSize:'15px',lineHeight:'2',fontWeight:500}},
          '乾三连　坤六断\n震仰盂　艮覆碗\n离中虚　坎中满\n兑上缺　巽下断')
      ),
      h('div',{className:'trigram-grid'},
        Object.keys(TRIGRAMS).map(function(k){var t=TRIGRAMS[k];
          return h('div',{className:'trigram-card wx-'+(t.wuxing==='金'?'jin':t.wuxing==='木'?'mu':t.wuxing==='水'?'shui':t.wuxing==='火'?'huo':'tu')},
            h('div',{className:'sym'},t.sym),
            h('div',{className:'info'},
              h('div',{className:'name'},t.name+' · '+t.wuxing),
              h('div',{className:'mnemonic'},t.mnemonic)
            )
          );
        })
      ),
      h('p',{style:{marginTop:'14px',fontSize:'13px',color:'var(--text-light)'}},'记住符号、名字、五行和口诀，准备好了就开始答题 👇'),
      h('div',{className:'source-tag'},'来源：《周易·说卦传》')
    ));
  },
  detail:function(main){
    main.appendChild(h('div',{className:'detail-card'},
      h('h3',{},'☰ 第1关详解：八卦入门'),
      h('h4',{style:{color:'#B8860B',marginTop:'16px',marginBottom:'8px',fontSize:'15px'}},'一、伏羲画卦——八卦的起源'),
      h('p',{},'《周易·系辞传下》记载：「古者包牺氏之王天下也，仰则观象于天，俯则观法于地，观鸟兽之文与地之宜，近取诸身，远取诸物，于是始作八卦，以通神明之德，以类万物之情。」伏羲（包牺氏）通过观察天地万物的运行规律——天象、地理、鸟兽、人身——将宇宙根本法则抽象为阴阳两种符号，三叠而成八卦。这是中国哲学「天人合一」思想的源头。'),
      h('h4',{style:{color:'#B8860B',marginTop:'16px',marginBottom:'8px',fontSize:'15px'}},'二、阴阳爻——八卦的基本符号'),

// ====== STATE ======
var SK = 'meihua_progress_v2';
function loadP(){try{return JSON.parse(localStorage.getItem(SK))||{}}catch(e){return{}}}
function saveP(p){localStorage.setItem(SK,JSON.stringify(p))}

var saved = loadP();
var state = {
  view:'menu',
  levelIdx:0,
  qIndex:0,
  score:0,
  correct:0,
  streak:0,
  bestStreak:saved.bestStreak||0,
  answered:false,
  _lastCorrect:false,
  _lastChoice:-1,
  inReview:false,
  reviewQIndex:0,
  reviewQs:[],
  testMode:false
};
if(!saved.completed)saved.completed={};

function curLevel(){return LEVELS[state.levelIdx];}
function curQ(){return curLevel().questions[state.qIndex];}
function totalQ(){return curLevel().questions.length;}
function levelDone(id){return saved.completed&&saved.completed[id];}
function canEnter(id){if(state.testMode)return true;if(id<=1)return true;return !!levelDone(id-1);}

// ====== MEMORY CURVE REVIEW ======
function getReviewQuestions(levelId){
  var all=[];
  var now=Date.now();
  var completed=saved.completed||{};
  Object.keys(completed).forEach(function(k){
    var lvId=parseInt(k);
    if(lvId>=levelId)return;
    var qs=LEVELS[lvId-1].questions;
    // Weight by recency - newer completions = more likely to pick
    var days=(now-completed[lvId].ts)/(86400000);
    var pick=days<1?3:days<3?2:days<7?1:0;
    while(pick>0){
      var rq=qs[Math.floor(Math.random()*qs.length)];
      rq._fromLevel=lvId;
      rq._fromTitle=LEVELS[lvId-1].title;
      all.push(rq);
      pick--;
    }
  });
  // Shuffle
  for(var i=all.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=all[i];all[i]=all[j];all[j]=t;}
  return all.slice(0,curLevel().reviewCount||0);
}

// ====== HELPERS ======
function h(tag,attrs){
  var el=document.createElement(tag);
  for(var k in attrs){
    if(attrs.hasOwnProperty(k)){
      var v=attrs[k];
      if(k.slice(0,2)==='on')el.addEventListener(k.slice(2).toLowerCase(),v);
      else if(k==='className')el.className=v;
      else if(k==='style'){for(var sk in v)el.style[sk]=v[sk];}
      else el.setAttribute(k,v);
    }
  }
  for(var i=2;i<arguments.length;i++)add(arguments[i]);
  function add(c){
    if(Array.isArray(c)){c.forEach(add);}
    else if(typeof c==='string'){el.appendChild(document.createTextNode(c));}
    else if(c)el.appendChild(c);
  }
  return el;
}
function wxCls(w){return w==='金'?'jin':w==='木'?'mu':w==='水'?'shui':w==='火'?'huo':'tu';}
function tarTrigram(k){return TRIGRAMS[k];}

    var label=q.family||q.animal||q.body||q.dir||'';
    qCard.appendChild(h('div',{className:'q-target-text'},'「'+label+'」→ 哪个卦？'));
  }
  if(q.type==='dir-order'){
    qCard.appendChild(h('div',{className:'q-target-text',style:{fontSize:'20px'}},q.from+' → ？'));
  }
  if(q.type==='sheng'||q.type==='ke'){
    qCard.appendChild(h('div',{style:{textAlign:'center',margin:'12px 0'}},
      h('span',{className:'wx-chip '+q.from,style:{fontSize:'24px',padding:'12px 24px'}},WUXING[q.from].name)
    ));
  }
  if(q.type==='who-sheng'||q.type==='who-ke'){
    qCard.appendChild(h('div',{className:'q-target-text'},'？ → '+WUXING[q.to].name));
  }
  if(q.type==='rel'){
    qCard.appendChild(h('div',{style:{textAlign:'center',margin:'12px 0',display:'flex',alignItems:'center',justifyContent:'center',gap:'8px'}},
      h('span',{className:'wx-chip '+q.a,style:{fontSize:'20px'}},WUXING[q.a].name),
      h('span',{style:{fontSize:'20px'}},'❓'),
      h('span',{className:'wx-chip '+q.b,style:{fontSize:'20px'}},WUXING[q.b].name)

function renderChoices(qCard,q){
  var choices=h('div',{className:'choices'});
  // 题目显符号 → 选项给文字（不转换）；题目显文字 → 选项给符号（只提取符号）
  var showSym=/-(sym)$/.test(q.type);
  q.choices.forEach(function(c,i){
    var label=showSym?c.replace(/[\u4e00-\u9fff]+/g,'').trim():c;
    var cls='choice-btn';
    var btn=h('button',{className:cls,onClick:function(){answer(i);}},label);
    if(state.answered)btn.disabled=true;
    if(state.answered){
      btn.disabled=true;
      if(i===q.answer)btn.classList.add('correct');
      else if(i===state._lastChoice&&!state._lastCorrect)btn.classList.add('wrong');
      else btn.classList.add('dim');
    }
    choices.appendChild(btn);
  });
  qCard.appendChild(choices);
}

function answer(idx){
  if(state.answered)return;
  state.answered=true;
  state._lastChoice=idx;
  var q=state.inReview?state.reviewQs[state.reviewQIndex]:curQ();
  state._lastCorrect=idx===q.answer;
  if(state._lastCorrect){
    if(!state.inReview){state.correct++;state.score+=Math.min(10+state.streak*2,25);}
    state.streak++; sfxCorrect(state.streak);
    var stEl=document.querySelector('.streak'); showStreakEffect(state.streak,stEl);
  }else{state.streak=0; sfxWrong();}
  state.bestStreak=Math.max(state.bestStreak,state.streak);
  var p=loadP();p.bestStreak=state.bestStreak;saveP(p);
  render();
}

// ====== 花光共舞 庆祝动画 ======
var _celebrationAF=null;

function startCelebration(canvas){
  var ctx=canvas.getContext('2d');
  var W=canvas.width=window.innerWidth, H=canvas.height=window.innerHeight;
  var sparkles=[], petals=[], startTs=null;
  var MAX_SPARKLES=80, PETAL_COUNT=25;

  // 初始爆发光点
  for(var i=0;i<60;i++){
    var angle=Math.random()*Math.PI*2;
    var dist=50+Math.random()*200;
    sparkles.push({
      x:W/2+Math.cos(angle)*dist*.3, y:H/2+Math.sin(angle)*dist*.3,
      tx:W/2+Math.cos(angle)*dist, ty:H/2+Math.sin(angle)*dist,
      size:1+Math.random()*2.5, life:1,
      decay:.004+Math.random()*.008, hue:35+Math.random()*20, trail:[]
    });
  }

  // 梅花瓣
  for(var j=0;j<PETAL_COUNT;j++){
    petals.push({
      x:W*.15+Math.random()*W*.7, y:-40-Math.random()*H*.6,
      size:6+Math.random()*14, speed:.2+Math.random()*.6,
      drift:(Math.random()-.5)*.5, rotation:Math.random()*Math.PI*2,
      rotSpeed:(Math.random()-.5)*.015, opacity:.4+Math.random()*.5,
      phase:Math.random()*2500, trail:[], glowPhase:Math.random()*Math.PI*2
    });
  }

  function drawPetal(x,y,size,rot,op,glow){
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    if(glow>.1){ctx.shadowColor='rgba(240,210,160,'+glow*.6+')';ctx.shadowBlur=8;}
    ctx.globalAlpha=op;
    ctx.fillStyle=glow>.3?'#f5deb3':'#e0c0a8';
    for(var k=0;k<5;k++){
      var a=(k/5)*Math.PI*2-Math.PI/2;
      ctx.beginPath();ctx.ellipse(Math.cos(a)*size*.4,Math.sin(a)*size*.4,size*.3,size*.48,a,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='#c89850';
    ctx.beginPath();ctx.arc(0,0,size*.15,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.restore();
  }

  function draw(ts){
    if(!startTs)startTs=ts;
    ctx.clearRect(0,0,W,H);

    // 中心微光
    var g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,160);
    g.addColorStop(0,'rgba(60,50,30,.15)');g.addColorStop(1,'rgba(60,50,30,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(W/2,H/2,200,0,Math.PI*2);ctx.fill();

    // 光点
    for(var i=sparkles.length-1;i>=0;i--){
      var s=sparkles[i];
      s.x+=(s.tx-s.x)*.06;s.y+=(s.ty-s.y)*.06;s.life-=s.decay;
      if(s.trail.length===0||Math.hypot(s.x-s.trail[s.trail.length-1].x,s.y-s.trail[s.trail.length-1].y)>3)
        s.trail.push({x:s.x,y:s.y,life:s.life});
      s.trail=s.trail.filter(function(t){t.life-=.02;return t.life>0;});
      for(var jj=1;jj<s.trail.length;jj++){
        var t0=s.trail[jj-1],t1=s.trail[jj],ta=t1.life*.3;
        ctx.strokeStyle='rgba(240,200,140,'+ta+')';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(t0.x,t0.y);ctx.lineTo(t1.x,t1.y);ctx.stroke();
      }
      if(s.life<=0){sparkles.splice(i,1);continue;}
      ctx.fillStyle='hsla('+s.hue+',80%,75%,'+s.life+')';
      ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);ctx.fill();
    }

    // 花瓣
    for(var p=0;p<petals.length;p++){
      var pt=petals[p];
      if(ts<pt.phase)continue;
      pt.y+=pt.speed;pt.x+=pt.drift+Math.sin(ts*.0008+pt.x*.008)*.4;
      pt.rotation+=pt.rotSpeed;pt.glowPhase+=.02;
      if(pt.y>H+50){pt.y=-50;pt.x=Math.random()*W;}
      var glow=.15+Math.abs(Math.sin(pt.glowPhase))*.2;
      drawPetal(pt.x,pt.y,pt.size,pt.rotation,pt.opacity*.75,glow);
      pt.trail.push({x:pt.x,y:pt.y,life:.6});
      pt.trail=pt.trail.filter(function(t){t.life-=.03;return t.life>0;});
      for(var jj2=1;jj2<pt.trail.length;jj2++){
        var ta2=pt.trail[jj2].life*.15;
        ctx.fillStyle='rgba(240,210,160,'+ta2+')';
        ctx.beginPath();ctx.arc(pt.trail[jj2].x,pt.trail[jj2].y,1.5,0,Math.PI*2);ctx.fill();
      }
    }

    // 持续补充光点
    if(sparkles.length<MAX_SPARKLES&&ts%400<20){
      sparkles.push({
        x:W*.2+Math.random()*W*.6,y:H*.5+Math.random()*H*.3,
        tx:W*.2+Math.random()*W*.6,ty:-50,
        size:1+Math.random()*2,life:1,decay:.006+Math.random()*.01,
        hue:30+Math.random()*30,trail:[]
      });
    }

    _celebrationAF=requestAnimationFrame(draw);
  }

  _celebrationAF=requestAnimationFrame(draw);

  window.addEventListener('resize',function rsz(){
    W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;
  });
}

function stopCelebration(){
  if(_celebrationAF){cancelAnimationFrame(_celebrationAF);_celebrationAF=null;}
}

function renderComplete(app){
  var lv=curLevel();
  var total=totalQ();
  var acc=Math.round((state.correct/total)*100);

  // Save
  var p=loadP();
  if(!p.completed)p.completed={};
  var prev=p.completed[lv.id];
  var passed = !lv.passThreshold || acc >= lv.passThreshold;
  if(passed && (!prev||acc>=prev.best)){
    p.completed[lv.id]={ts:Date.now(),score:state.correct,total:total,best:acc};
  }
  p.bestStreak=state.bestStreak;
  saveP(p);
  saved=p;

  sfxComplete();

  // Canvas 动画
  var canvas=h('canvas',{id:'celebration-canvas'});
  app.appendChild(canvas);
  startCelebration(canvas);

  // 暗色遮罩
  var hexagrams=lv.hexagrams||[];
  var hexStr=hexagrams.length?hexagrams.join(' · '):lv.title;

  var stats=h('div',{className:'complete-stats'},
    h('div',{className:'complete-stat'},h('div',{className:'complete-stat-val'},state.correct+'/'+total),h('div',{className:'complete-stat-label'},'全对')),
    h('div',{className:'complete-stat'},h('div',{className:'complete-stat-val'},'✦'+state.bestStreak),h('div',{className:'complete-stat-label'},'连击')),
    h('div',{className:'complete-stat'},h('div',{className:'complete-stat-val'},acc+'%'),h('div',{className:'complete-stat-label'},'正确率'))
  );

  var cleanup=function(){
    stopCelebration();
    var cv=document.getElementById('celebration-canvas');
    if(cv)cv.remove();
    var ov=document.querySelector('.complete-overlay');
    if(ov)ov.remove();
  };

  app.appendChild(h('div',{className:'complete-overlay show'},
    h('div',{className:'complete-card'},
      h('div',{className:'complete-badge'},'✦  通  关  ✦'),
      h('div',{className:'complete-title'},'第'+lv.id+'关'),
      h('div',{className:'complete-sub'},hexStr),
      stats,
      lv.passThreshold&&!passed?h('div',{className:'complete-warn'},
        h('div',{className:'complete-warn-title'},'⚠️ 未通过'),
        h('div',{className:'complete-warn-text'},'需要 ≥'+lv.passThreshold+'% 正确率才能解锁下一关')
      ):null,
      h('button',{className:'complete-btn primary',onClick:function(){
        cleanup();state.view='intro';state.qIndex=0;state.answered=false;state.score=0;state.correct=0;state.streak=0;render();
      }},'再 来 一 次'),
      h('button',{className:'complete-btn',onClick:function(){cleanup();goMenu();}},'返 回 目 录')
    )
  ));
}

// ====== PWA ======
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js',{scope:'/meihua-xuetang/'});
}

document.addEventListener('touchstart', initAudio, {once:true});
document.addEventListener('click', initAudio, {once:true});
render();
</script>
