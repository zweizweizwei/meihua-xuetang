<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#58CC02">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>梅花易数学堂</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🌸</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#58CC02;--green-dark:#46A302;--red:#FF4B4B;--bg:#F7F7F7;--card:#fff;--text:#3C3C3C;--text-light:#777;--border:#E5E5E5;--gold:#FFC800;--metal:#FFD700;--wood:#4CAF50;--water:#2196F3;--fire:#FF5722;--earth:#8D6E63}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;-webkit-tap-highlight-color:transparent;user-select:none}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

/* Header */
.header{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.logo .icon{font-size:28px}
.streak{display:flex;align-items:center;gap:4px;font-weight:600;font-size:15px;color:var(--gold)}
.streak-emoji{font-size:20px}

/* Progress */
.progress-wrap{padding:0 20px 16px}
.progress-bar{height:12px;background:var(--border);border-radius:6px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);border-radius:6px;transition:width .4s ease}
.progress-text{font-size:12px;color:var(--text-light);margin-top:4px;text-align:right}

/* Main content */
.main{flex:1;padding:0 20px 20px;display:flex;flex-direction:column;gap:16px}

/* Question card */
.q-card{background:var(--card);border-radius:16px;padding:24px;border:2px solid var(--border);transition:border-color .3s}
.q-card.correct{border-color:var(--green);background:#F0FFE5}
.q-card.wrong{border-color:var(--red);background:#FFF0F0}
.q-prompt{font-size:16px;color:var(--text-light);margin-bottom:16px;line-height:1.5}
.q-target{font-size:42px;text-align:center;margin:12px 0;line-height:1.2}
.q-target-text{font-size:28px;font-weight:700;text-align:center;margin:12px 0}

/* Choices */
.choices{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.choice-btn{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:14px 12px;font-size:15px;cursor:pointer;transition:all .15s;text-align:center;font-weight:500;color:var(--text);min-height:52px;display:flex;align-items:center;justify-content:center;gap:6px}
.choice-btn:active{transform:scale(.97)}
.choice-btn:hover:not(:disabled){border-color:#B8B8B8}
.choice-btn:disabled{cursor:default}
.choice-btn.correct{border-color:var(--green);background:#D7FFB8;color:#3C7A00}
.choice-btn.wrong{border-color:var(--red);background:#FFD4D4;color:#B80000}
.choice-btn.dim{opacity:.5}

/* Feedback */
.feedback{text-align:center;padding:12px;border-radius:12px;font-weight:600;font-size:16px;display:none}
.feedback.show{display:block}
.feedback.correct{background:#D7FFB8;color:#3C7A00}
.feedback.wrong{background:#FFD4D4;color:#B80000}
.feedback .emoji{font-size:28px;display:block;margin-bottom:4px}
.feedback .hint{font-size:13px;font-weight:400;margin-top:4px;opacity:.8}

/* Bottom bar */
.bottom{padding:12px 20px 20px}
.continue-btn{width:100%;padding:16px;border:none;border-radius:14px;background:var(--green);color:#fff;font-size:17px;font-weight:700;cursor:pointer;transition:all .15s;display:none}
.continue-btn.show{display:block}
.continue-btn:active{transform:scale(.98);background:var(--green-dark)}

/* Level complete */
.complete-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;z-index:10;padding:20px}
.complete-overlay.show{display:flex}
.complete-card{background:#fff;border-radius:20px;padding:32px 24px;text-align:center;max-width:360px;width:100%}
.complete-emoji{font-size:64px;margin-bottom:12px}
.complete-title{font-size:24px;font-weight:700;margin-bottom:8px}
.complete-stats{display:flex;justify-content:center;gap:24px;margin:16px 0}
.complete-stat{text-align:center}
.complete-stat-val{font-size:28px;font-weight:700;color:var(--green)}
.complete-stat-label{font-size:12px;color:var(--text-light)}
.complete-btn{width:100%;padding:16px;border:none;border-radius:14px;background:var(--green);color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-top:8px}

/* Trigrams display */
.trigram-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.trigram-card{background:var(--bg);border-radius:12px;padding:14px 10px;text-align:center;border-left:4px solid var(--border);display:flex;align-items:center;gap:10px}
.trigram-card .sym{font-size:36px;min-width:44px}
.trigram-card .info{text-align:left;flex:1}
.trigram-card .info .name{font-weight:700;font-size:15px}
.trigram-card .info .wuxing{color:var(--text-light);font-size:12px}
.trigram-card .info .mnemonic{font-size:12px;color:var(--green);font-weight:600;margin-top:2px}
.trigram-card.wx-jin{border-left-color:var(--metal)}
.trigram-card.wx-mu{border-left-color:var(--wood)}
.trigram-card.wx-shui{border-left-color:var(--water)}
.trigram-card.wx-huo{border-left-color:var(--fire)}
.trigram-card.wx-tu{border-left-color:var(--earth)}

/* Lesson intro */
.intro-card{background:var(--card);border-radius:16px;padding:24px;text-align:center;border:2px solid var(--border)}
.intro-card h2{font-size:22px;margin-bottom:8px}
.intro-card p{color:var(--text-light);line-height:1.6;font-size:14px}

/* Responsive */
@media(max-width:380px){
  .trigram-card .sym{font-size:28px;min-width:36px}
  .choices{grid-template-columns:1fr}
  .q-target{font-size:32px}
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ===== DATA =====
const TRIGRAMS = {
  qian:{sym:'☰',name:'乾',wuxing:'金',nature:'天',props:'健、阳、刚、创始',family:'父',mnemonic:'乾三连'},
  dui:{sym:'☱',name:'兑',wuxing:'金',nature:'泽',props:'悦、说、少女、口舌',family:'少女',mnemonic:'兑上缺'},
  li:{sym:'☲',name:'离',wuxing:'火',nature:'火',props:'丽、明、文、附丽',family:'中女',mnemonic:'离中虚'},
  zhen:{sym:'☳',name:'震',wuxing:'木',nature:'雷',props:'动、起、决躁、惊',family:'长男',mnemonic:'震仰盂'},
  xun:{sym:'☴',name:'巽',wuxing:'木',nature:'风',props:'入、顺、长女、不果',family:'长女',mnemonic:'巽下断'},
  kan:{sym:'☵',name:'坎',wuxing:'水',nature:'水',props:'陷、险、润下、隐伏',family:'中男',mnemonic:'坎中满'},
  gen:{sym:'☶',name:'艮',wuxing:'土',nature:'山',props:'止、静、少男、阻',family:'少男',mnemonic:'艮覆碗'},
  kun:{sym:'☷',name:'坤',wuxing:'土',nature:'地',props:'顺、柔、母、载物',family:'母',mnemonic:'坤六断'}
};

const LEVELS = [{
  id:1, title:'八卦入门', desc:'认识八个卦象的符号和名称',
  questions:[
    {type:'sym-to-name',sym:'qian',choices:['乾','坤','震','巽'],answer:0,prompt:'这个卦象叫什么名字？'},
    {type:'sym-to-name',sym:'kun',choices:['艮','兑','坤','离'],answer:2,prompt:'选出正确的卦名'},
    {type:'sym-to-name',sym:'li',choices:['离','坎','震','兑'],answer:0,prompt:'这个符号是哪个卦？'},
    {type:'sym-to-name',sym:'kan',choices:['巽','坎','离','艮'],answer:1,prompt:'识别这个卦象'},
    {type:'sym-to-name',sym:'zhen',choices:['兑','艮','震','巽'],answer:2,prompt:'这是什么卦？'},
    {type:'sym-to-name',sym:'dui',choices:['艮','兑','乾','坤'],answer:1,prompt:'选出这个卦的正确名称'},
    {type:'sym-to-name',sym:'xun',choices:['震','离','巽','坎'],answer:2,prompt:'识别卦象'},
    {type:'sym-to-name',sym:'gen',choices:['艮','兑','震','离'],answer:0,prompt:'这个符号叫什么？'},
    {type:'sym-to-wuxing',sym:'qian',choices:['木','火','金','水'],answer:2,prompt:'乾卦的五行是什么？'},
    {type:'sym-to-wuxing',sym:'li',choices:['金','木','水','火'],answer:3,prompt:'离卦对应哪个五行？'},
    {type:'sym-to-wuxing',sym:'kan',choices:['火','土','金','水'],answer:3,prompt:'坎卦的五行属性？'},
    {type:'sym-to-wuxing',sym:'zhen',choices:['木','火','土','金'],answer:0,prompt:'震卦属什么五行？'},
    {type:'nature-to-sym',nature:'天',choices:['乾☰','坤☷','震☳','离☲'],answer:0,prompt:'「天」对应哪个卦？'},
    {type:'nature-to-sym',nature:'地',choices:['艮☶','兑☱','坤☷','坎☵'],answer:2,prompt:'「地」的自然之卦是？'},
    {type:'nature-to-sym',nature:'雷',choices:['离☲','震☳','巽☴','乾☰'],answer:1,prompt:'「雷」对应八卦中的？'},
    {type:'wuxing-to-name',wuxing:'水',choices:['离','坎','兑','坤'],answer:1,prompt:'五行属水的是哪一个？'},
    {type:'wuxing-to-name',wuxing:'火',choices:['震','艮','离','坎'],answer:2,prompt:'五行属火的是？'},
    {type:'name-to-sym',name:'兑',choices:['☴','☱','☲','☶'],answer:1,prompt:'兑卦的符号是？'},
    {type:'name-to-sym',name:'离',choices:['☰','☵','☲','☳'],answer:2,prompt:'离卦的符号？'},
    {type:'mnemonic-to-name',mnemonic:'坎中满',choices:['离','坎','兑','巽'],answer:1,prompt:'「坎中满」说的是哪个卦？'},
  ]
}];

// ===== STATE =====
const storageKey = 'meihua_progress';
function loadProgress(){
  try{return JSON.parse(localStorage.getItem(storageKey))||{}}catch(e){return{}}
}
function saveProgress(p){
  localStorage.setItem(storageKey,JSON.stringify(p));
}
let state = {
  level:1,
  qIndex:0,
  score:0,
  correct:0,
  streak:0,
  bestStreak:0,
  answered:false,
  totalQuestions:LEVELS[0].questions.length,
  showIntro:true
};
const p = loadProgress();
if(p.bestStreak) state.bestStreak = p.bestStreak;
state.bestStreak = Math.max(state.bestStreak, p.bestStreak||0);

// ===== HELPERS =====
function h(tag,attrs={},...children){
  const el=document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k.startsWith('on'))el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='className')el.className=v;
    else if(k==='style')Object.assign(el.style,v);
    else el.setAttribute(k,v);
  });
  children.forEach(c=>{
    if(typeof c==='string')el.appendChild(document.createTextNode(c));
    else if(c)el.appendChild(c);
  });
  return el;
}
const trigram=id=>TRIGRAMS[id];
const wxPinyin=w=>({金:'jin',木:'mu',水:'shui',火:'huo',土:'tu'})[w]||'';

// ===== RENDER =====
function render(){
  const app=document.getElementById('app');
  app.innerHTML='';
  const level=LEVELS[0];
  const q=level.questions[state.qIndex];
  const progress=(state.qIndex/state.totalQuestions)*100;

  // Header
  app.appendChild(h('div',{className:'header'},
    h('div',{className:'logo'},h('span',{className:'icon'},'🌸'),'梅花易数学堂'),
    h('div',{className:'streak'},h('span',{className:'streak-emoji'},'🔥'),`${state.bestStreak}`)
  ));

  // Progress (only show during quiz)
  if(!state.showIntro){
    app.appendChild(h('div',{className:'progress-wrap'},
      h('div',{className:'progress-bar'},h('div',{className:'progress-fill',style:{width:progress+'%'}})),
      h('div',{className:'progress-text'},`第 ${state.qIndex+1}/${state.totalQuestions} 题`)
    ));
  }

  const main=h('div',{className:'main'});

  if(state.showIntro){
    // Intro card with teaching content
    main.appendChild(h('div',{className:'intro-card'},
      h('h2',{},'☰ 第一关：八卦入门'),
      h('p',{style:{marginBottom:'12px',textAlign:'left',lineHeight:'1.7'}},
        '八卦由阳爻（⚊）和阴爻（⚋）三层叠加而成，共八种组合，对应自然界的八种基本现象。每个卦有符号、名称、五行属性。'
      ),
      // Mnemonic rhyme
      h('div',{style:{background:'#FFF9E6',borderRadius:'10px',padding:'12px 14px',marginBottom:'12px',textAlign:'center'}},
        h('div',{style:{fontWeight:700,fontSize:'14px',marginBottom:'6px',color:'#B8860B'}},'📝 八卦取象口诀'),
        h('div',{style:{fontSize:'15px',lineHeight:'2',fontWeight:500}},
          '乾三连　坤六断\n震仰盂　艮覆碗\n离中虚　坎中满\n兑上缺　巽下断'
        )
      ),
      h('p',{style:{fontSize:'13px',color:'var(--text-light)',marginBottom:'8px',textAlign:'left'}},
        '💡 口诀就是每个卦的图形特征——比如「离中虚」是说离卦 ☲ 中间是空的，「坎中满」是说坎卦 ☵ 中间是满的。看一眼符号就记住了！'
      ),
      // Trigram cards grid
      h('div',{className:'trigram-grid'},
        ...Object.entries(TRIGRAMS).map(([id,t])=>
          h('div',{className:'trigram-card wx-'+wxPinyin(t.wuxing)},
            h('div',{className:'sym'},t.sym),
            h('div',{className:'info'},
              h('div',{className:'name'},t.name+' · '+t.wuxing),
              h('div',{className:'wuxing'},t.nature+' · '+t.props.split('、').slice(0,2).join(' ')),
              h('div',{className:'mnemonic'},t.mnemonic)
            )
          )
        )
      ),
      h('p',{style:{marginTop:'14px',fontSize:'13px',color:'var(--text-light)'}},'记住它们的符号、名字和口诀，准备好了就开始答题 👇')
    ));
    main.appendChild(h('div',{className:'bottom'},
      h('button',{className:'continue-btn show',onClick:()=>{state.showIntro=false;render()}},'开始答题')
    ));
  } else if(state.qIndex < state.totalQuestions){
    // Question
    const qCard=h('div',{className:'q-card'+(state.answered?(state._lastCorrect?' correct':' wrong'):'')});
    qCard.appendChild(h('div',{className:'q-prompt'},q.prompt));
    
    // Target display
    if(q.type.startsWith('sym-to') || q.type==='name-to-sym'){
      const tkey = q.sym || Object.entries(TRIGRAMS).find(function(e){return e[1].name===q.name})?.[0];
      qCard.appendChild(h('div',{className:'q-target'},tkey && trigram(tkey) ? trigram(tkey).sym : ''));
    }
    if(q.type==='name-to-sym'){
      qCard.appendChild(h('div',{className:'q-target-text'},`${q.name}卦`));
    }
    if(q.type==='sym-to-wuxing'){
      const t=q.sym?trigram(q.sym):null;
      qCard.appendChild(h('div',{className:'q-target'},t?.sym||''));
      qCard.appendChild(h('div',{className:'q-target-text'},t?.name||''));
    }
    if(q.type==='nature-to-sym'){
      qCard.appendChild(h('div',{className:'q-target-text'},`「${q.nature}」`));
    }
    if(q.type==='wuxing-to-name'){
      qCard.appendChild(h('div',{className:'q-target-text'},`五行：${q.wuxing}`));
    }
    if(q.type==='mnemonic-to-name'){
      qCard.appendChild(h('div',{className:'q-target-text',style:{fontSize:'22px',color:'var(--green)',background:'#FFF9E6',padding:'8px 16px',borderRadius:'8px',display:'inline-block'}},`「${q.mnemonic}」`));
    }

    const choices=h('div',{className:'choices'});
    q.choices.forEach((c,i)=>{
      const btn=h('button',{className:'choice-btn',onClick:()=>!state.answered && answer(i)});
      if(q.type==='name-to-sym') btn.textContent = c;
      else if(q.type==='nature-to-sym' || q.type.startsWith('sym-to')) btn.textContent = c;
      else btn.textContent = c;
      
      if(state.answered){
        btn.disabled=true;
        if(i===q.answer) btn.classList.add('correct');
        else if(i===state._lastChoice && !state._lastCorrect) btn.classList.add('wrong');
        else btn.classList.add('dim');
      }
      choices.appendChild(btn);
    });
    qCard.appendChild(choices);
    main.appendChild(qCard);

    // Feedback
    if(state.answered){
      const fb=h('div',{className:'feedback show '+(state._lastCorrect?'correct':'wrong')});
      fb.appendChild(h('span',{className:'emoji'},state._lastCorrect?'🎉':'😅'));
      fb.appendChild(document.createTextNode(state._lastCorrect?'正确！':'不对哦'));
      if(!state._lastCorrect && q.hint){
        fb.appendChild(h('div',{className:'hint'},q.hint));
      }
      if(state._lastCorrect){
        const t=q.sym?trigram(q.sym):null;
        if(t)fb.appendChild(h('div',{className:'hint'},`${t.sym} ${t.name} · ${t.wuxing} · ${t.nature} · ${t.props}`));
      }
      main.appendChild(fb);
    }

    main.appendChild(h('div',{className:'bottom'},
      h('button',{
        className:'continue-btn'+(state.answered?' show':''),
        onClick:()=>{
          if(state.qIndex+1 >= state.totalQuestions){showComplete()}else{nextQuestion()}
        }
      },state.qIndex+1 >= state.totalQuestions?'查看结果':'继续')
    ));
  }

  app.appendChild(main);
}

function answer(choiceIdx){
  if(state.answered) return;
  state.answered = true;
  state._lastChoice = choiceIdx;
  const q=LEVELS[0].questions[state.qIndex];
  state._lastCorrect = choiceIdx === q.answer;
  
  if(state._lastCorrect){
    state.correct++;
    state.streak++;
    state.score += Math.min(10 + state.streak * 2, 25);
  } else {
    state.streak = 0;
  }
  state.bestStreak = Math.max(state.bestStreak, state.streak);
  const prog = loadProgress();
  prog.bestStreak = state.bestStreak;
  prog.lastPlayed = new Date().toISOString();
  saveProgress(prog);
  
  render();
}

function nextQuestion(){
  state.qIndex++;
  state.answered=false;
  state._lastCorrect=undefined;
  state._lastChoice=undefined;
  render();
}

function showComplete(){
  const accuracy=Math.round((state.correct/state.totalQuestions)*100);
  app.innerHTML='';
  app.appendChild(h('div',{className:'complete-overlay show'},
    h('div',{className:'complete-card'},
      h('div',{className:'complete-emoji'},accuracy>=80?'🌸':accuracy>=60?'👍':'💪'),
      h('div',{className:'complete-title'},'关卡完成！'),
      h('div',{className:'complete-stats'},
        h('div',{className:'complete-stat'},
          h('div',{className:'complete-stat-val'},`${state.correct}/${state.totalQuestions}`),
          h('div',{className:'complete-stat-label'},'正确')
        ),
        h('div',{className:'complete-stat'},
          h('div',{className:'complete-stat-val'},accuracy+'%'),
          h('div',{className:'complete-stat-label'},'正确率')
        ),
        h('div',{className:'complete-stat'},
          h('div',{className:'complete-stat-val'},'🔥'+state.bestStreak),
          h('div',{className:'complete-stat-label'},'最佳连对')
        )
      ),
      h('button',{className:'complete-btn',onClick:()=>{
        state={qIndex:0,score:0,correct:0,streak:0,bestStreak:state.bestStreak,answered:false,showIntro:true,totalQuestions:state.totalQuestions};
        render();
      }},'再来一次')
    )
  ));
}

// PWA
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js', {scope: '/meihua-xuetang/'});
}

render();
</script>
</body>
</html>
