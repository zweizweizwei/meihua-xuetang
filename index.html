<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#58CC02">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>多灵国-八卦版</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🌸</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#58CC02;--green-dark:#46A302;--red:#FF4B4B;--bg:#F7F7F7;--card:#fff;--text:#3C3C3C;--text-light:#777;--border:#E5E5E5;--gold:#FFC800;--metal:#FFD700;--wood:#4CAF50;--water:#2196F3;--fire:#FF5722;--earth:#8D6E63}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;-webkit-tap-highlight-color:transparent;user-select:none}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

/* Header */
.header{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo .icon{font-size:28px}
.streak{display:flex;align-items:center;gap:4px;font-weight:600;font-size:15px;color:var(--gold)}

/* Progress */
.progress-wrap{padding:0 20px 16px}
.progress-bar{height:12px;background:var(--border);border-radius:6px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);border-radius:6px;transition:width .4s ease}
.progress-text{font-size:12px;color:var(--text-light);margin-top:4px;text-align:right}

/* Main */
.main{flex:1;padding:0 20px 20px;display:flex;flex-direction:column;gap:16px}

/* Question card */
.q-card{background:var(--card);border-radius:16px;padding:24px;border:2px solid var(--border);transition:border-color .3s}
.q-card.correct{border-color:var(--green);background:#F0FFE5}
.q-card.wrong{border-color:var(--red);background:#FFF0F0}
.q-prompt{font-size:16px;color:var(--text-light);margin-bottom:16px;line-height:1.5}
.q-target{font-size:42px;text-align:center;margin:12px 0;line-height:1.2}
.q-target-text{font-size:24px;font-weight:700;text-align:center;margin:12px 0}

/* Choices */
.choices{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.choice-btn{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:14px 12px;font-size:15px;cursor:pointer;transition:all .15s;text-align:center;font-weight:500;color:var(--text);min-height:52px;display:flex;align-items:center;justify-content:center;gap:6px}
.choice-btn:active{transform:scale(.97)}
.choice-btn:disabled{cursor:default}
.choice-btn.correct{border-color:var(--green);background:#D7FFB8;color:#3C7A00}
.choice-btn.wrong{border-color:var(--red);background:#FFD4D4;color:#B80000}
.choice-btn.dim{opacity:.5}

/* Feedback */
.feedback{text-align:center;padding:12px;border-radius:12px;font-weight:600;font-size:16px;display:none}
.feedback.show{display:block}
.feedback.correct{background:#D7FFB8;color:#3C7A00}
.feedback.wrong{background:#FFD4D4;color:#B80000}
.feedback .emoji{font-size:28px;display:block;margin-bottom:4px}
.feedback .hint{font-size:13px;font-weight:400;margin-top:4px;opacity:.8}

/* Bottom */
.bottom{padding:12px 20px 20px}
.continue-btn{width:100%;padding:16px;border:none;border-radius:14px;background:var(--green);color:#fff;font-size:17px;font-weight:700;cursor:pointer;transition:all .15s;display:none}
.continue-btn.show{display:block}
.continue-btn:active{transform:scale(.98);background:var(--green-dark)}
.continue-btn.white{background:#fff;color:var(--green);border:2px solid var(--green)}

/* Level complete */
.complete-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;z-index:10;padding:20px}
.complete-overlay.show{display:flex}
.complete-card{background:#fff;border-radius:20px;padding:32px 24px;text-align:center;max-width:360px;width:100%}
.complete-emoji{font-size:64px;margin-bottom:12px}
.complete-title{font-size:24px;font-weight:700;margin-bottom:8px}
.complete-stats{display:flex;justify-content:center;gap:24px;margin:16px 0}
.complete-stat{text-align:center}
.complete-stat-val{font-size:28px;font-weight:700;color:var(--green)}
.complete-stat-label{font-size:12px;color:var(--text-light)}
.complete-btn{width:100%;padding:16px;border:none;border-radius:14px;background:var(--green);color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-top:8px}

/* Intro card */
.intro-card{background:var(--card);border-radius:16px;padding:24px;text-align:center;border:2px solid var(--border)}

/* Menu - level cards */
.menu-grid{display:flex;flex-direction:column;gap:12px;padding:16px 0}
.level-card{background:var(--card);border-radius:16px;padding:20px;border:2px solid var(--border);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:16px}
.level-card:active{transform:scale(.98);border-color:var(--green)}
.level-card.locked{opacity:.5;cursor:not-allowed}
.level-card .lc-icon{font-size:40px;min-width:50px;text-align:center}
.level-card .lc-info{flex:1}
.level-card .lc-title{font-weight:700;font-size:17px;margin-bottom:4px}
.level-card .lc-desc{font-size:13px;color:var(--text-light)}
.level-card .lc-badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px}
.level-card .lc-badge.done{background:#D7FFB8;color:#3C7A00}
.level-card .lc-badge.open{background:#FFF3CD;color:#856404}

/* Trigram grid */
.trigram-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.trigram-card{background:var(--bg);border-radius:12px;padding:14px 10px;text-align:center;border-left:4px solid var(--border);display:flex;align-items:center;gap:10px}
.trigram-card .sym{font-size:36px;min-width:44px}
.trigram-card .info{text-align:left;flex:1}
.trigram-card .info .name{font-weight:700;font-size:15px}
.trigram-card .info .wuxing{color:var(--text-light);font-size:12px}
.trigram-card .info .mnemonic{font-size:12px;color:var(--green);font-weight:600;margin-top:2px}
.trigram-card.wx-jin{border-left-color:var(--metal)}
.trigram-card.wx-mu{border-left-color:var(--wood)}
.trigram-card.wx-shui{border-left-color:var(--water)}
.trigram-card.wx-huo{border-left-color:var(--fire)}
.trigram-card.wx-tu{border-left-color:var(--earth)}

/* Wuxing cycle */
.wx-cycle{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;margin:12px 0}
.wx-chip{padding:8px 16px;border-radius:12px;font-weight:700;font-size:16px;color:#fff}
.wx-chip.jin{background:#FFD700;color:#5D4E37}
.wx-chip.mu{background:#4CAF50}
.wx-chip.shui{background:#2196F3}
.wx-chip.huo{background:#FF5722}
.wx-chip.tu{background:#8D6E63}
.wx-arrow{font-size:20px;color:var(--text-light)}

/* Back button */
.back-btn{background:none;border:none;font-size:22px;cursor:pointer;padding:4px 8px;color:var(--text-light)}

/* Review section */
.review-section{background:#FFF9E6;border-radius:12px;padding:14px;border:2px dashed #E6D88A;margin-bottom:4px}
.review-section .rs-title{font-size:13px;font-weight:700;color:#B8860B;margin-bottom:8px;text-align:center}
.review-q{margin-bottom:8px;font-size:14px}
.review-q .rq-prompt{color:var(--text-light);margin-bottom:4px}
.review-q .rq-choices{display:flex;gap:6px;flex-wrap:wrap}

/* Source tag */
.source-tag{font-size:11px;color:var(--text-light);text-align:center;margin-top:8px;font-style:italic;opacity:.7}

/* Tab bar for review */
.review-bar{display:flex;gap:8px;margin-bottom:8px}
.review-bar button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--border);background:var(--card);font-size:14px;font-weight:600;cursor:pointer}
.review-bar button.active{border-color:var(--green);background:#D7FFB8;color:#3C7A00}

@media(max-width:380px){
  .trigram-card .sym{font-size:28px;min-width:36px}
  .choices{grid-template-columns:1fr}
  .q-target{font-size:32px}
  .q-target-text{font-size:20px}
  .level-card .lc-icon{font-size:30px;min-width:40px}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// ====== DATA ======
var TRIGRAMS = {
  qian:{sym:'☰',name:'乾',wuxing:'金',nature:'天',mnemonic:'乾三连',family:'父',animal:'马',body:'首',dir:'西北'},
  dui:{sym:'☱',name:'兑',wuxing:'金',nature:'泽',mnemonic:'兑上缺',family:'少女',animal:'羊',body:'口',dir:'西'},
  li:{sym:'☲',name:'离',wuxing:'火',nature:'火',mnemonic:'离中虚',family:'中女',animal:'雉',body:'目',dir:'南'},
  zhen:{sym:'☳',name:'震',wuxing:'木',nature:'雷',mnemonic:'震仰盂',family:'长男',animal:'龙',body:'足',dir:'东'},
  xun:{sym:'☴',name:'巽',wuxing:'木',nature:'风',mnemonic:'巽下断',family:'长女',animal:'鸡',body:'股',dir:'东南'},
  kan:{sym:'☵',name:'坎',wuxing:'水',nature:'水',mnemonic:'坎中满',family:'中男',animal:'豕',body:'耳',dir:'北'},
  gen:{sym:'☶',name:'艮',wuxing:'土',nature:'山',mnemonic:'艮覆碗',family:'少男',animal:'狗',body:'手',dir:'东北'},
  kun:{sym:'☷',name:'坤',wuxing:'土',nature:'地',mnemonic:'坤六断',family:'母',animal:'牛',body:'腹',dir:'西南'}
};

var WUXING = {
  mu:{name:'木',sheng:'huo',ke:'tu'},
  huo:{name:'火',sheng:'tu',ke:'jin'},
  tu:{name:'土',sheng:'jin',ke:'shui'},
  jin:{name:'金',sheng:'shui',ke:'mu'},
  shui:{name:'水',sheng:'mu',ke:'huo'}
};
var WX_ORDER = ['mu','huo','tu','jin','shui'];

var LEVELS = [];

// ==== LEVEL 1: 八卦入门 ====
LEVELS.push({
  id:1, icon:'☰', title:'八卦入门', desc:'认识八个卦象的符号、名称和五行',
  source:'《周易·说卦传》',
  reviewCount:0,
  teaching:function(main){
    main.appendChild(h('div',{className:'intro-card'},
      h('h2',{},'☰ 第1关：八卦入门'),
      h('p',{style:{fontSize:'14px',color:'var(--text-light)',marginBottom:'12px',lineHeight:'1.6'}},
        '八卦由阳爻（⚊）和阴爻（⚋）三层叠加而成，共八种组合，分别对应自然界的八种基本现象。'),
      h('div',{style:{background:'#FFF9E6',borderRadius:'10px',padding:'12px 14px',marginBottom:'12px',textAlign:'center'}},
        h('div',{style:{fontWeight:700,fontSize:'14px',marginBottom:'6px',color:'#B8860B'}},'📝 八卦取象口诀'),
        h('div',{style:{fontSize:'15px',lineHeight:'2',fontWeight:500}},
          '乾三连　坤六断\n震仰盂　艮覆碗\n离中虚　坎中满\n兑上缺　巽下断')
      ),
      h('div',{className:'trigram-grid'},
        Object.keys(TRIGRAMS).map(function(k){var t=TRIGRAMS[k];
          return h('div',{className:'trigram-card wx-'+(t.wuxing==='金'?'jin':t.wuxing==='木'?'mu':t.wuxing==='水'?'shui':t.wuxing==='火'?'huo':'tu')},
            h('div',{className:'sym'},t.sym),
            h('div',{className:'info'},
              h('div',{className:'name'},t.name+' · '+t.wuxing),
              h('div',{className:'mnemonic'},t.mnemonic)
            )
          );
        })
      ),
      h('p',{style:{marginTop:'14px',fontSize:'13px',color:'var(--text-light)'}},'记住符号、名字、五行和口诀，准备好了就开始答题 👇'),
      h('div',{className:'source-tag'},'来源：《周易·说卦传》')
    ));
  },
  questions:[
    {prompt:'这个卦象叫什么名字？',type:'sym-name',sym:'qian',choices:['乾','坤','震','巽'],answer:0},
    {prompt:'选出正确的卦名',type:'sym-name',sym:'kun',choices:['艮','兑','坤','离'],answer:2},
    {prompt:'这个符号是哪个卦？',type:'sym-name',sym:'li',choices:['离','坎','震','兑'],answer:0},
    {prompt:'识别这个卦象',type:'sym-name',sym:'kan',choices:['巽','坎','离','艮'],answer:1},
    {prompt:'这是什么卦？',type:'sym-name',sym:'zhen',choices:['兑','艮','震','巽'],answer:2},
    {prompt:'选出这个卦的正确名称',type:'sym-name',sym:'dui',choices:['艮','兑','乾','坤'],answer:1},
    {prompt:'识别卦象',type:'sym-name',sym:'xun',choices:['震','离','巽','坎'],answer:2},
    {prompt:'这个符号叫什么？',type:'sym-name',sym:'gen',choices:['艮','兑','震','离'],answer:0},
    {prompt:'乾卦的五行是什么？',type:'sym-wx',sym:'qian',choices:['木','火','金','水'],answer:2},
    {prompt:'离卦对应哪个五行？',type:'sym-wx',sym:'li',choices:['金','木','水','火'],answer:3},
    {prompt:'坎卦的五行属性？',type:'sym-wx',sym:'kan',choices:['火','土','金','水'],answer:3},
    {prompt:'震卦的五行？',type:'sym-wx',sym:'zhen',choices:['木','火','土','金'],answer:0},
    {prompt:'兑卦的五行？',type:'sym-wx',sym:'dui',choices:['木','火','金','水'],answer:2},
    {prompt:'艮卦的五行？',type:'sym-wx',sym:'gen',choices:['木','火','水','土'],answer:3},
    {prompt:'「天」对应哪个卦？',type:'nat-sym',nature:'天',choices:['乾☰','坤☷','震☳','离☲'],answer:0},
    {prompt:'「地」的自然之卦是？',type:'nat-sym',nature:'地',choices:['艮☶','兑☱','坤☷','坎☵'],answer:2},
    {prompt:'五行属水的是哪个卦？',type:'wx-name',wuxing:'水',choices:['离','坎','兑','坤'],answer:1},
    {prompt:'五行属火的是？',type:'wx-name',wuxing:'火',choices:['震','艮','离','坎'],answer:2},
    {prompt:'「坎中满」说的是哪个卦？',type:'mne-name',mnemonic:'坎中满',choices:['离','坎','兑','巽'],answer:1},
    {prompt:'「离中虚」说的是哪个卦？',type:'mne-name',mnemonic:'离中虚',choices:['离','坎','震','兑'],answer:0}
  ]
});

// ==== LEVEL 2: 五行生克 ====
LEVELS.push({
  id:2, icon:'🔥', title:'五行生克', desc:'五行相生与相克的基本规律',
  source:'《尚书·洪范》',
  reviewCount:2,
  teaching:function(main){
    main.appendChild(h('div',{className:'intro-card'},
      h('h2',{},'🔥 第2关：五行生克'),
      h('p',{style:{fontSize:'14px',color:'var(--text-light)',marginBottom:'14px',lineHeight:'1.6'}},
        '五行（木火土金水）不是孤立的，它们之间有「生」和「克」两种基本关系——这是理解万物相互作用的基础。'),
      h('div',{style:{textAlign:'center',margin:'12px 0'}},
        h('img',{src:'wuxing-diagram.svg',alt:'五行生克图',style:{width:'100%',maxWidth:'380px',borderRadius:'12px'}})
      ),
      h('div',{style:{display:'flex',gap:'10px',marginTop:'8px'}},
        h('div',{style:{flex:1,background:'#E8F5E9',borderRadius:'8px',padding:'10px',textAlign:'center'}},
          h('div',{style:{fontWeight:700,fontSize:'13px',color:'#2E7D32',marginBottom:'4px'}},'🌱 相生'),
          h('div',{style:{fontSize:'12px',color:'var(--text-light)',lineHeight:'1.6'}},'木→火→土→金→水→木')
        ),
        h('div',{style:{flex:1,background:'#FFF3E0',borderRadius:'8px',padding:'10px',textAlign:'center'}},
          h('div',{style:{fontWeight:700,fontSize:'13px',color:'#E65100',marginBottom:'4px'}},'⚡ 相克'),
          h('div',{style:{fontSize:'12px',color:'var(--text-light)',lineHeight:'1.6'}},'木→土→水→火→金→木')
        )
      ),
      h('p',{style:{fontSize:'13px',color:'var(--text-light)',marginTop:'10px',lineHeight:'1.6'}},
        '💡 记忆口诀：\n「生」— 钻木取火、火烬成土、土中藏金、金融成水、水润生木\n「克」— 木破土、土挡水、水灭火、火熔金、金砍木'),
      h('div',{className:'source-tag'},'来源：《尚书·洪范》五行')
    ));
  },
  questions:[
    {prompt:'木生什么？',type:'sheng',from:'mu',choices:['火','金','水','土'],answer:0},
    {prompt:'火生什么？',type:'sheng',from:'huo',choices:['木','土','金','水'],answer:1},
    {prompt:'土生什么？',type:'sheng',from:'tu',choices:['水','木','金','火'],answer:2},
    {prompt:'金生什么？',type:'sheng',from:'jin',choices:['土','火','水','木'],answer:2},
    {prompt:'水生什么？',type:'sheng',from:'shui',choices:['金','土','木','火'],answer:2},
    {prompt:'金克什么？',type:'ke',from:'jin',choices:['水','木','火','土'],answer:1},
    {prompt:'木克什么？',type:'ke',from:'mu',choices:['水','火','土','金'],answer:2},
    {prompt:'水克什么？',type:'ke',from:'shui',choices:['木','土','火','金'],answer:2},
    {prompt:'火克什么？',type:'ke',from:'huo',choices:['土','水','金','木'],answer:2},
    {prompt:'土克什么？',type:'ke',from:'tu',choices:['火','金','水','木'],answer:2},
    {prompt:'什么是生木的？',type:'who-sheng',to:'mu',choices:['火','水','金','土'],answer:1},
    {prompt:'什么是生火的？',type:'who-sheng',to:'huo',choices:['水','木','土','金'],answer:1},
    {prompt:'什么是生土的？',type:'who-sheng',to:'tu',choices:['木','金','火','水'],answer:2},
    {prompt:'什么克金？',type:'who-ke',to:'jin',choices:['水','火','土','木'],answer:1},
    {prompt:'什么克木？',type:'who-ke',to:'mu',choices:['土','金','水','火'],answer:1},
    {prompt:'木和火的关系是？',type:'rel',a:'mu',b:'huo',choices:['木生火','火生木','木克火','火克木'],answer:0},
    {prompt:'水和火的关系是？',type:'rel',a:'shui',b:'huo',choices:['水生火','火生水','水克火','火克水'],answer:2},
    {prompt:'金和木的关系是？',type:'rel',a:'jin',b:'mu',choices:['金生木','木生金','金克木','木克金'],answer:2},
    {prompt:'土和金的关系是？',type:'rel',a:'tu',b:'jin',choices:['土生金','金生土','土克金','金克土'],answer:0},
    {prompt:'火和金的关系是？',type:'rel',a:'huo',b:'jin',choices:['火生金','金生火','火克金','金克火'],answer:2}
  ]
});

// ==== LEVEL 3: 八卦人物类象 ====
LEVELS.push({
  id:3, icon:'👨‍👩‍👧‍👦', title:'八卦取象：人物', desc:'每个卦对应一个家庭成员角色',
  source:'《周易·说卦传》第十章',
  pitfalls:'兑=少女（非中女），离=中女（非少女）——网络常见谬误',
  reviewCount:2,
  teaching:function(main){
    var fam = [['乾','父','☰'],['坤','母','☷'],['震','长男','☳'],['坎','中男','☵'],['艮','少男','☶'],['巽','长女','☴'],['离','中女','☲'],['兑','少女','☱']];
    main.appendChild(h('div',{className:'intro-card'},
      h('h2',{},'👨‍👩‍👧‍👦 第3关：八卦取象·人物'),
      h('p',{style:{fontSize:'14px',color:'var(--text-light)',marginBottom:'12px',lineHeight:'1.6'}},
        '《说卦传》第十章说：乾为天，故称乎父；坤为地，故称乎母。八卦各代表一个家庭角色——这就是「乾坤生六子」的由来。'),
      h('div',{style:{background:'#F3E5F5',borderRadius:'10px',padding:'14px',marginBottom:'10px'}},
        h('div',{style:{fontWeight:700,fontSize:'14px',marginBottom:'8px',color:'#7B1FA2'}},'📖 一家八口'),
        h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}},

    if(lvId>=levelId)return;
    var qs=LEVELS[lvId-1].questions;
    // Weight by recency - newer completions = more likely to pick
    var days=(now-completed[lvId].ts)/(86400000);
    var pick=days<1?3:days<3?2:days<7?1:0;
    while(pick>0){
      var rq=qs[Math.floor(Math.random()*qs.length)];
      rq._fromLevel=lvId;
      rq._fromTitle=LEVELS[lvId-1].title;
      all.push(rq);
      pick--;
    }
  });
  // Shuffle
  for(var i=all.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=all[i];all[i]=all[j];all[j]=t;}
  return all.slice(0,curLevel().reviewCount||0);
}

// ====== HELPERS ======
function h(tag,attrs){
  var el=document.createElement(tag);
  for(var k in attrs){
    if(attrs.hasOwnProperty(k)){
      var v=attrs[k];
      if(k.slice(0,2)==='on')el.addEventListener(k.slice(2).toLowerCase(),v);
      else if(k==='className')el.className=v;
      else if(k==='style'){for(var sk in v)el.style[sk]=v[sk];}
      else el.setAttribute(k,v);
    }
  }
  for(var i=2;i<arguments.length;i++)add(arguments[i]);
  function add(c){
    if(Array.isArray(c)){c.forEach(add);}
    else if(typeof c==='string'){el.appendChild(document.createTextNode(c));}
    else if(c)el.appendChild(c);
  }
  return el;
}
function wxCls(w){return w==='金'?'jin':w==='木'?'mu':w==='水'?'shui':w==='火'?'huo':'tu';}
function tarTrigram(k){return TRIGRAMS[k];}

// ====== RENDER ======
function render(){
  var app=document.getElementById('app');
  app.innerHTML='';
  var lv=curLevel();

  app.appendChild(h('div',{className:'header'},
    h('div',{className:'logo',onClick:goMenu},
      h('span',{className:'icon'},'🌸'),'多灵国-八卦版'),
    h('div',{className:'streak'},h('span',{style:{fontSize:'20px'}},'🔥'),''+state.bestStreak)
  ));

  if(state.view==='menu')renderMenu(app);
  else if(state.view==='intro')renderIntro(app);
  else if(state.view==='review')renderReview(app);
  else if(state.view==='quiz')renderQuiz(app);
  else if(state.view==='complete')renderComplete(app);
}

function goMenu(){
  state.view='menu';state.qIndex=0;state.answered=false;state.score=0;state.correct=0;state.streak=0;state.inReview=false;
  render();
}

function renderMenu(app){
  app.appendChild(h('div',{className:'main'},
    h('h2',{style:{textAlign:'center',marginBottom:'4px',fontSize:'22px'}},'📚 选择关卡'),
    h('div',{className:'menu-grid'},
      LEVELS.map(function(lv,i){
        var done=levelDone(lv.id);
        var open=canEnter(lv.id);
        var cls='level-card'+(open?'':' locked');
        var badge=done?h('span',{className:'lc-badge done'},'✅ 已通关（'+saved.completed[lv.id].best+'%）')
          :open?h('span',{className:'lc-badge open'},'⏳ 待挑战')
          :h('span',{className:'lc-badge',style:{background:'#E5E5E5',color:'#999'}},'🔒 未解锁');
        return h('div',{className:cls,onClick:function(){
          if(!open)return;
          state.levelIdx=i;state.qIndex=0;state.answered=false;state.score=0;state.correct=0;state.streak=0;
          state.inReview=false;state.reviewQs=[];state.reviewQIndex=0;
          // Generate review questions
          if(lv.reviewCount>0){
            state.reviewQs=getReviewQuestions(lv.id);
            state.view=state.reviewQs.length>0?'review':'intro';
          }else{
            state.view='intro';
          }
          render();
        }},
          h('div',{className:'lc-icon'},lv.icon),
          h('div',{className:'lc-info'},
            h('div',{className:'lc-title'},'第'+lv.id+'关：'+lv.title),
            h('div',{className:'lc-desc'},lv.desc)
          ),
          badge
        );
      })
    ),
    h('div',{style:{textAlign:'center',marginTop:'16px',fontSize:'13px',color:'var(--text-light)'}},
      '通关前一关才能解锁下一关 🔓'
    )
  ));
}

function renderIntro(app){
  var lv=curLevel();
  var main=h('div',{className:'main'});
  main.appendChild(h('button',{className:'back-btn',onClick:goMenu,style:{alignSelf:'flex-start'}},'← 返回目录'));
  lv.teaching(main);
  main.appendChild(h('div',{className:'bottom'},
    h('button',{className:'continue-btn show',onClick:function(){state.view='quiz';render();}},'开始答题（共'+totalQ()+'题）')
  ));
  app.appendChild(main);
}

// Review screen — shows memory curve review questions before the lesson
function renderReview(app){
  var lv=curLevel();
  var main=h('div',{className:'main'});
  main.appendChild(h('button',{className:'back-btn',onClick:goMenu,style:{alignSelf:'flex-start'}},'← 返回目录'));

  // Review header
  main.appendChild(h('div',{className:'review-section'},
    h('div',{className:'rs-title'},'🔄 温故知新（记忆曲线复习）'),
    h('p',{style:{fontSize:'12px',color:'var(--text-light)',textAlign:'center',marginBottom:'8px'}},
      '复习 '+state.reviewQs.length+' 道来自前面关卡的内容')
  ));

  // If all review questions done, show lesson
  if(state.reviewQIndex>=state.reviewQs.length){
    main.appendChild(h('div',{style:{textAlign:'center',padding:'20px'}},
      h('div',{style:{fontSize:'40px',marginBottom:'8px'}},'✅'),
      h('p',{style:{fontWeight:700,fontSize:'16px',marginBottom:'16px'}},'复习完成！准备进入新课'),
      h('button',{className:'continue-btn show',onClick:function(){state.view='intro';render();}},'进入教学')
    ));
    app.appendChild(main);
    return;
  }

  var rq=state.reviewQs[state.reviewQIndex];
  var qCard=h('div',{className:'q-card'+(state.answered?(state._lastCorrect?' correct':' wrong'):'')});
  qCard.appendChild(h('div',{className:'q-prompt'},
    h('span',{style:{fontSize:'11px',color:'#B8860B',display:'block',marginBottom:'4px'}},'来自：第'+rq._fromLevel+'关「'+rq._fromTitle+'」'),
    rq.prompt
  ));
  renderQuestionTarget(qCard,rq);
  renderChoices(qCard,rq);
  main.appendChild(qCard);

  if(state.answered){
    var fb=h('div',{className:'feedback show '+(state._lastCorrect?'correct':'wrong')});
    fb.appendChild(h('span',{className:'emoji'},state._lastCorrect?'🎉':'😅'));
    fb.appendChild(document.createTextNode(state._lastCorrect?'正确！':'再想想'));
    if(!state._lastCorrect){
      fb.appendChild(h('div',{className:'hint'},'正确答案：'+rq.choices[rq.answer]));
    }
    main.appendChild(fb);
  }

  main.appendChild(h('div',{className:'bottom'},
    h('button',{className:'continue-btn'+(state.answered?' show':''),onClick:function(){
      state.reviewQIndex++;state.answered=false;state._lastCorrect=false;state._lastChoice=-1;
      render();
    }},state.reviewQIndex+1>=state.reviewQs.length?'进入教学':'下一题')
  ));

  app.appendChild(main);
}

function renderQuestionTarget(qCard,q){
  if(q.type==='sym-name'||q.type==='sym-wx'||q.type==='sym-fam'||q.type==='sym-ani'||q.type==='sym-bod'||q.type==='sym-dir'||q.type==='sym-nat'||q.type==='sym-nat2'){
    var t=tarTrigram(q.sym);if(t)qCard.appendChild(h('div',{className:'q-target'},t.sym));
  }
  if(q.type==='nat-sym')qCard.appendChild(h('div',{className:'q-target-text'},'「'+q.nature+'」'));
  if(q.type==='wx-name')qCard.appendChild(h('div',{className:'q-target-text',style:{fontSize:'28px'}},q.wuxing));
  if(q.type==='mne-name')qCard.appendChild(h('div',{className:'q-target-text',style:{fontSize:'22px',color:'var(--green)',background:'#FFF9E6',padding:'8px 16px',borderRadius:'8px',display:'inline-block'}},'「'+q.mnemonic+'」'));
  if(q.type==='fam-sym'||q.type==='ani-sym'||q.type==='bod-sym'||q.type==='dir-sym'){
    var label=q.family||q.animal||q.body||q.dir||'';
    qCard.appendChild(h('div',{className:'q-target-text'},'「'+label+'」→ 哪个卦？'));
  }
  if(q.type==='dir-order'){
    qCard.appendChild(h('div',{className:'q-target-text',style:{fontSize:'20px'}},q.from+' → ？'));
  }
  if(q.type==='sheng'||q.type==='ke'){
    qCard.appendChild(h('div',{style:{textAlign:'center',margin:'12px 0'}},
      h('span',{className:'wx-chip '+q.from,style:{fontSize:'24px',padding:'12px 24px'}},WUXING[q.from].name)
    ));
  }
  if(q.type==='who-sheng'||q.type==='who-ke'){
    qCard.appendChild(h('div',{className:'q-target-text'},'？ → '+WUXING[q.to].name));
  }
  if(q.type==='rel'){
    qCard.appendChild(h('div',{style:{textAlign:'center',margin:'12px 0',display:'flex',alignItems:'center',justifyContent:'center',gap:'8px'}},
      h('span',{className:'wx-chip '+q.a,style:{fontSize:'20px'}},WUXING[q.a].name),
      h('span',{style:{fontSize:'20px'}},'❓'),
      h('span',{className:'wx-chip '+q.b,style:{fontSize:'20px'}},WUXING[q.b].name)
    ));
  }
}

function renderChoices(qCard,q){
  var choices=h('div',{className:'choices'});
  q.choices.forEach(function(c,i){
    var btn=h('button',{className:'choice-btn',onClick:function(){answer(i)}},c);
    if(state.answered){
      btn.disabled=true;
      if(i===q.answer)btn.classList.add('correct');
      else if(i===state._lastChoice&&!state._lastCorrect)btn.classList.add('wrong');
      else btn.classList.add('dim');
    }
    choices.appendChild(btn);
  });
  qCard.appendChild(choices);
}

function renderQuiz(app){
  var lv=curLevel();
  var q=curQ();
  var prog=(state.qIndex/totalQ())*100;

  app.appendChild(h('div',{className:'progress-wrap'},
    h('div',{className:'progress-bar'},h('div',{className:'progress-fill',style:{width:prog+'%'}})),
    h('div',{className:'progress-text'},'第'+(state.qIndex+1)+'/'+totalQ()+' 题')
  ));

  var main=h('div',{className:'main'});
  main.appendChild(h('button',{className:'back-btn',onClick:goMenu,style:{alignSelf:'flex-start'}},'← 返回目录'));

  var qCard=h('div',{className:'q-card'+(state.answered?(state._lastCorrect?' correct':' wrong'):'')});
  qCard.appendChild(h('div',{className:'q-prompt'},
    h('span',{style:{fontSize:'11px',color:'var(--text-light)',display:'block',marginBottom:'4px'}},
      '第'+lv.id+'关 · '+lv.title),
    q.prompt
  ));
  renderQuestionTarget(qCard,q);
  renderChoices(qCard,q);
  main.appendChild(qCard);

  if(state.answered){
    var fb=h('div',{className:'feedback show '+(state._lastCorrect?'correct':'wrong')});
    fb.appendChild(h('span',{className:'emoji'},state._lastCorrect?'🎉':'😅'));
    fb.appendChild(document.createTextNode(state._lastCorrect?'正确！':'不对哦'));
    if(!state._lastCorrect){
      fb.appendChild(h('div',{className:'hint'},'正确答案：'+q.choices[q.answer]));
    }
    if(state._lastCorrect&&q.type==='sheng'){
      fb.appendChild(h('div',{className:'hint'},WUXING[q.from].name+'生'+WUXING[WUXING[q.from].sheng].name));
    }
    if(state._lastCorrect&&q.type==='ke'){
      fb.appendChild(h('div',{className:'hint'},WUXING[q.from].name+'克'+WUXING[WUXING[q.from].ke].name));
    }
    main.appendChild(fb);
  }

  main.appendChild(h('div',{className:'bottom'},
    h('button',{className:'continue-btn'+(state.answered?' show':''),onClick:function(){
      if(state.qIndex+1>=totalQ()){state.view='complete';render();}
      else{state.qIndex++;state.answered=false;state._lastCorrect=false;state._lastChoice=-1;render();}
    }},state.qIndex+1>=totalQ()?'查看结果':'继续')
  ));

  app.appendChild(main);
}

function answer(idx){
  if(state.answered)return;
  state.answered=true;
  state._lastChoice=idx;
  var q=state.inReview?state.reviewQs[state.reviewQIndex]:curQ();
  state._lastCorrect=idx===q.answer;
  if(state._lastCorrect){
    if(!state.inReview){state.correct++;state.score+=Math.min(10+state.streak*2,25);}
    state.streak++;
  }else{state.streak=0;}
  state.bestStreak=Math.max(state.bestStreak,state.streak);
  var p=loadP();p.bestStreak=state.bestStreak;saveP(p);
  render();
}

function renderComplete(app){
  var lv=curLevel();
  var total=totalQ();
  var acc=Math.round((state.correct/total)*100);

  // Save
  var p=loadP();
  if(!p.completed)p.completed={};
  var prev=p.completed[lv.id];
  if(!prev||acc>=prev.best){
    p.completed[lv.id]={ts:Date.now(),score:state.correct,total:total,best:acc};
  }
  p.bestStreak=state.bestStreak;
  saveP(p);
  saved=p;

  app.appendChild(h('div',{className:'complete-overlay show'},
    h('div',{className:'complete-card'},
      h('div',{className:'complete-emoji'},acc>=80?'🌸':acc>=60?'👍':'💪'),
      h('div',{className:'complete-title'},'第'+lv.id+'关 完成！'),
      h('div',{className:'complete-stats'},
        h('div',{className:'complete-stat'},
          h('div',{className:'complete-stat-val'},state.correct+'/'+total),
          h('div',{className:'complete-stat-label'},'正确')
        ),
        h('div',{className:'complete-stat'},
          h('div',{className:'complete-stat-val'},acc+'%'),
          h('div',{className:'complete-stat-label'},'正确率')
        ),
        h('div',{className:'complete-stat'},
          h('div',{className:'complete-stat-val'},'🔥'+state.bestStreak),
          h('div',{className:'complete-stat-label'},'最佳连对')
        )
      ),
      h('button',{className:'complete-btn',onClick:function(){
        state.view='intro';state.qIndex=0;state.answered=false;state.score=0;state.correct=0;state.streak=0;render();
      }},'再来一次'),
      h('button',{className:'complete-btn white',onClick:goMenu},'返回目录')
    )
  ));
}

// ====== PWA ======
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js',{scope:'/meihua-xuetang/'});
}

render();
</script>
