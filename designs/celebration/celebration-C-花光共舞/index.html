<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C · 花光共舞</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Noto Serif SC", serif;
    background: #0d0d12;
    color: #e8e4dd;
    overflow: hidden;
    height: 100vh;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
  }
  canvas { position: fixed; top: 0; left: 0; z-index: 0; }
  .overlay {
    position: relative; z-index: 10;
    text-align: center;
    opacity: 0;
  }
  .overlay.visible {
    animation: riseIn 0.9s 1.5s ease-out forwards;
  }
  @keyframes riseIn {
    0% { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .badge {
    display: inline-block; padding: 6px 24px;
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 20px;
    font-size: 0.8rem; letter-spacing: 0.2em;
    color: #c4a060; margin-bottom: 14px;
  }
  .title {
    font-size: 2.6rem; font-weight: 300;
    color: #efe0c8;
    margin-bottom: 6px;
  }
  .sub {
    font-size: 0.95rem; color: #7a7260;
    margin-bottom: 28px;
  }
  .stat-row {
    display: flex; gap: 28px; justify-content: center;
    margin-bottom: 36px;
  }
  .stat {
    text-align: center;
  }
  .stat-val {
    font-size: 1.5rem; font-weight: 600;
    color: #d4b060;
  }
  .stat-lbl {
    font-size: 0.7rem; color: #5a5448;
    letter-spacing: 0.1em;
  }
  .btn {
    display: inline-block; padding: 11px 44px;
    border: 1px solid rgba(212,175,55,0.35);
    border-radius: 24px;
    color: #d4b060; font-size: 0.95rem;
    cursor: pointer; transition: all 0.4s;
    background: transparent;
    position: relative; overflow: hidden;
  }
  .btn::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(212,175,55,0.1) 0%, transparent 70%);
    opacity: 0; transition: opacity 0.4s;
  }
  .btn:hover::after { opacity: 1; }
  .btn:hover { border-color: #d4b060; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="overlay visible" id="overlay">
  <div class="badge">✦ 通 关 ✦</div>
  <div class="title">八卦入门</div>
  <div class="sub">乾坤震巽 · 坎离艮兑</div>
  <div class="stat-row">
    <div class="stat"><div class="stat-val">8/8</div><div class="stat-lbl">全对</div></div>
    <div class="stat"><div class="stat-val">✦3</div><div class="stat-lbl">连击</div></div>
    <div class="stat"><div class="stat-val">48s</div><div class="stat-lbl">用时</div></div>
  </div>
  <button class="btn" onclick="location.reload()">继 续</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);

// 光点粒子（尾巴效果）
const sparkles = [];
const MAX_SPARKLES = 80;

// 初始爆发
for (let i = 0; i < 60; i++) {
  const angle = Math.random() * Math.PI * 2;
  const dist = 50 + Math.random() * 200;
  sparkles.push({
    x: W/2 + Math.cos(angle) * dist * 0.3,
    y: H/2 + Math.sin(angle) * dist * 0.3,
    tx: W/2 + Math.cos(angle) * dist,
    ty: H/2 + Math.sin(angle) * dist,
    size: 1 + Math.random() * 2.5,
    life: 1,
    decay: 0.004 + Math.random() * 0.008,
    hue: 35 + Math.random() * 20,
    trail: [],
  });
}

// 梅花瓣 + 光尾
const petals = [];
const PETAL_COUNT = 25;
for (let i = 0; i < PETAL_COUNT; i++) {
  petals.push({
    x: W * 0.15 + Math.random() * W * 0.7,
    y: -40 - Math.random() * H * 0.6,
    size: 6 + Math.random() * 14,
    speed: 0.2 + Math.random() * 0.6,
    drift: (Math.random() - 0.5) * 0.5,
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.015,
    opacity: 0.4 + Math.random() * 0.5,
    phase: Math.random() * 2500,
    trail: [],
    glowPhase: Math.random() * Math.PI * 2,
  });
}

function petalDraw(x, y, size, rotation, opacity, glow) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation);
  // 微光
  if (glow > 0.1) {
    ctx.shadowColor = `rgba(240,210,160,${glow * 0.6})`;
    ctx.shadowBlur = 8;
  }
  ctx.globalAlpha = opacity;
  ctx.fillStyle = glow > 0.3 ? '#f5deb3' : '#e0c0a8';
  for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
    ctx.beginPath();
    ctx.ellipse(
      Math.cos(angle) * size * 0.4,
      Math.sin(angle) * size * 0.4,
      size * 0.3, size * 0.48, angle, 0, Math.PI * 2
    );
    ctx.fill();
  }
  ctx.fillStyle = '#c89850';
  ctx.beginPath(); ctx.arc(0, 0, size * 0.15, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();
}

function draw(timestamp) {
  ctx.clearRect(0, 0, W, H);

  // 中心微光晕
  const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, 160);
  grad.addColorStop(0, 'rgba(60,50,30,0.15)');
  grad.addColorStop(1, 'rgba(60,50,30,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(W/2, H/2, 200, 0, Math.PI*2); ctx.fill();

  // 光点飞散
  for (let i = sparkles.length - 1; i >= 0; i--) {
    const s = sparkles[i];
    s.x += (s.tx - s.x) * 0.06;
    s.y += (s.ty - s.y) * 0.06;
    s.life -= s.decay;

    if (s.trail.length === 0 || Math.hypot(s.x - s.trail[s.trail.length-1].x, s.y - s.trail[s.trail.length-1].y) > 3) {
      s.trail.push({ x: s.x, y: s.y, life: s.life });
    }
    // 清理旧尾巴
    s.trail = s.trail.filter(t => { t.life -= 0.02; return t.life > 0; });

    // 画尾巴
    for (let j = 1; j < s.trail.length; j++) {
      const t0 = s.trail[j-1], t1 = s.trail[j];
      const a = t1.life * 0.3;
      ctx.strokeStyle = `rgba(240,200,140,${a})`;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(t0.x, t0.y); ctx.lineTo(t1.x, t1.y); ctx.stroke();
    }

    if (s.life <= 0) { sparkles.splice(i, 1); continue; }

    ctx.fillStyle = `hsla(${s.hue},80%,75%,${s.life})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
  }

  // 梅花瓣
  for (const p of petals) {
    if (timestamp < p.phase) continue;
    p.y += p.speed;
    p.x += p.drift + Math.sin(timestamp * 0.0008 + p.x * 0.008) * 0.4;
    p.rotation += p.rotSpeed;
    p.glowPhase += 0.02;

    if (p.y > H + 50) { p.y = -50; p.x = Math.random() * W; }

    const glow = 0.15 + Math.abs(Math.sin(p.glowPhase)) * 0.2;
    petalDraw(p.x, p.y, p.size, p.rotation, p.opacity * 0.75, glow);

    // 花瓣尾迹微光
    p.trail.push({ x: p.x, y: p.y, life: 0.6 });
    p.trail = p.trail.filter(t => { t.life -= 0.03; return t.life > 0; });
    for (let j = 1; j < p.trail.length; j++) {
      const a = p.trail[j].life * 0.15;
      ctx.fillStyle = `rgba(240,210,160,${a})`;
      ctx.beginPath();
      ctx.arc(p.trail[j].x, p.trail[j].y, 1.5, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // 持续补充光点
  if (sparkles.length < MAX_SPARKLES && timestamp % 400 < 20) {
    sparkles.push({
      x: W * 0.2 + Math.random() * W * 0.6,
      y: H * 0.5 + Math.random() * H * 0.3,
      tx: W * 0.2 + Math.random() * W * 0.6,
      ty: -50,
      size: 1 + Math.random() * 2,
      life: 1,
      decay: 0.006 + Math.random() * 0.01,
      hue: 30 + Math.random() * 30,
      trail: [],
    });
  }

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
