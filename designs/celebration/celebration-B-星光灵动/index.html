<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B · 星光灵动</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", sans-serif;
    background: #0d0d12;
    color: #e8e4dd;
    overflow: hidden;
    height: 100vh;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
  }
  canvas { position: fixed; top: 0; left: 0; z-index: 0; }
  .overlay {
    position: relative; z-index: 10;
    text-align: center;
    opacity: 0;
    animation: popIn 0.6s 1.2s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }
  @keyframes popIn {
    0% { opacity: 1; transform: scale(0.6); }
    100% { opacity: 1; transform: scale(1); }
  }
  .star-icon {
    font-size: 3rem; margin-bottom: 8px;
    animation: starPulse 2s ease-in-out infinite;
  }
  @keyframes starPulse {
    0%,100% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.15); filter: brightness(1.4); }
  }
  .label {
    font-size: 0.85rem; letter-spacing: 0.25em;
    color: #8a8a9e; margin-bottom: 10px;
  }
  .title {
    font-size: 2.6rem; font-weight: 600;
    background: linear-gradient(135deg, #c9b8f0 0%, #f0d78c 50%, #b8d4f0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .sub {
    font-size: 0.95rem; color: #6e6e82;
    margin-bottom: 10px;
  }
  .score-ring {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 8px 20px; margin-bottom: 32px;
  }
  .score-num { font-size: 1.4rem; font-weight: 700; color: #f0d78c; }
  .score-label { font-size: 0.8rem; color: #6e6e82; }
  .btn {
    display: inline-block; padding: 10px 40px;
    background: linear-gradient(135deg, #7c5ce7 0%, #5b8def 100%);
    border: none; border-radius: 24px;
    color: #fff; font-size: 0.95rem; font-weight: 500;
    cursor: pointer; transition: all 0.3s;
    box-shadow: 0 0 30px rgba(124,92,231,0.3);
  }
  .btn:hover {
    box-shadow: 0 0 50px rgba(124,92,231,0.5);
    transform: translateY(-1px);
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="overlay">
  <div class="star-icon">✦</div>
  <div class="label">八卦入门 · 通关</div>
  <div class="title">学有所成</div>
  <div class="sub">乾坎艮震·巽离坤兑</div>
  <div class="score-ring">
    <span class="score-num">8</span><span class="score-label">/ 8 题全对</span>
  </div>
  <br>
  <button class="btn" onclick="location.reload()">下一关 ✦</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);

const particles = [];
const MAX = 120;

// 爆发波
let burstTime = 0;
let burstAlpha = 0;

function spawnBurst() {
  burstTime = performance.now();
  burstAlpha = 0.6;
}

// 初始粒子爆发
for (let i = 0; i < MAX; i++) {
  const angle = Math.random() * Math.PI * 2;
  const speed = 1 + Math.random() * 4;
  particles.push({
    x: W / 2,
    y: H / 2,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    size: 1 + Math.random() * 3,
    life: 1,
    decay: 0.003 + Math.random() * 0.006,
    hue: 35 + Math.random() * 15, // gold
    glow: Math.random() > 0.6,
  });
}
spawnBurst();

// 持续微光粒子
setInterval(() => {
  if (particles.length > 200) return;
  particles.push({
    x: W * 0.2 + Math.random() * W * 0.6,
    y: H * 0.2 + Math.random() * H * 0.6,
    vx: (Math.random() - 0.5) * 0.3,
    vy: -0.2 - Math.random() * 0.5,
    size: 0.5 + Math.random() * 1.5,
    life: 1,
    decay: 0.008 + Math.random() * 0.015,
    hue: 260 + Math.random() * 40,
    glow: false,
  });
}, 200);

function draw(timestamp) {
  ctx.clearRect(0, 0, W, H);

  // 中心光晕
  const elapBurst = (timestamp - burstTime) / 1000;
  if (elapBurst < 3) {
    const r = elapBurst * 120;
    const a = burstAlpha * Math.max(0, 1 - elapBurst / 3);
    const grad = ctx.createRadialGradient(W/2, H/2, r * 0.1, W/2, H/2, r);
    grad.addColorStop(0, `rgba(240,215,140,${a * 0.5})`);
    grad.addColorStop(0.5, `rgba(200,180,150,${a * 0.2})`);
    grad.addColorStop(1, 'rgba(200,180,150,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(W/2, H/2, r, 0, Math.PI*2); ctx.fill();
  }

  // 后台微光闪烁（星星背景）
  if (timestamp % 800 < 20) {
    // occasional twinkle spots
  }

  // 粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.005; // slight gravity
    p.life -= p.decay;

    if (p.life <= 0) { particles.splice(i, 1); continue; }

    const alpha = p.life;
    ctx.fillStyle = p.glow
      ? `rgba(240,215,140,${alpha})`
      : `hsla(${p.hue},60%,75%,${alpha})`;
    ctx.shadowColor = p.glow ? `rgba(240,215,140,${alpha * 0.8})` : 'transparent';
    ctx.shadowBlur = p.glow ? 6 : 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
