<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440">
  <defs>
    <marker id="arrow-sheng" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#58CC02"/>
    </marker>
    <marker id="arrow-ke" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF4B4B"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="440" height="440" rx="16" fill="#FAFAFA"/>

  <!-- Element positions (pentagon, radius=125, center=220,220) -->
  <!-- 木 top: (220,95)  火 upper-right 火: (339,143)  土 lower-right 土: (293,321)
       金 lower-left 金: (147,321)  水 upper-left 水: (101,143) -->

  <!-- 相克 arrows (inner star) — draw under the 相生 arrows for layering -->
  <!-- 木→土: top to lower-right -->
  <path d="M 220 120 Q 260 200 270 295" stroke="#FF4B4B" stroke-width="2.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arrow-ke)" opacity="0.7"/>
  <!-- 土→水: lower-right to upper-left -->
  <path d="M 265 295 Q 220 260 125 165" stroke="#FF4B4B" stroke-width="2.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arrow-ke)" opacity="0.7"/>
  <!-- 水→火: upper-left to upper-right -->
  <path d="M 125 165 Q 180 120 315 165" stroke="#FF4B4B" stroke-width="2.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arrow-ke)" opacity="0.7"/>
  <!-- 火→金: upper-right to lower-left -->
  <path d="M 315 170 Q 275 230 172 298" stroke="#FF4B4B" stroke-width="2.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arrow-ke)" opacity="0.7"/>
  <!-- 金→木: lower-left to top -->
  <path d="M 170 298 Q 180 200 198 122" stroke="#FF4B4B" stroke-width="2.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arrow-ke)" opacity="0.7"/>

  <!-- 相生 arrows (outer circle) -->
  <!-- 木→火: top to upper-right, curve clockwise -->
  <path d="M 255 105 Q 320 90  345 170" stroke="#58CC02" stroke-width="3" fill="none" marker-end="url(#arrow-sheng)"/>
  <!-- 火→土: upper-right to lower-right, curve clockwise -->
  <path d="M 345 195 Q 355 270 298 340" stroke="#58CC02" stroke-width="3" fill="none" marker-end="url(#arrow-sheng)"/>
  <!-- 土→金: lower-right to lower-left, curve clockwise -->
  <path d="M 265 340 Q 220 370 175 340" stroke="#58CC02" stroke-width="3" fill="none" marker-end="url(#arrow-sheng)"/>
  <!-- 金→水: lower-left to upper-left, curve clockwise -->
  <path d="M 142 340 Q 85 270  95 170" stroke="#58CC02" stroke-width="3" fill="none" marker-end="url(#arrow-sheng)"/>
  <!-- 水→木: upper-left to top, curve clockwise -->
  <path d="M 95 140 Q 90 90  185 105" stroke="#58CC02" stroke-width="3" fill="none" marker-end="url(#arrow-sheng)"/>

  <!-- 相生 labels -->
  <text x="310" y="95" font-size="12" fill="#58CC02" font-weight="700" text-anchor="middle">木生火</text>
  <text x="370" y="260" font-size="12" fill="#58CC02" font-weight="700" text-anchor="middle">火生土</text>
  <text x="220" y="392" font-size="12" fill="#58CC02" font-weight="700" text-anchor="middle">土生金</text>
  <text x="70" y="260" font-size="12" fill="#58CC02" font-weight="700" text-anchor="middle">金生水</text>
  <text x="70" y="95" font-size="12" fill="#58CC02" font-weight="700" text-anchor="middle">水生木</text>

  <!-- 相克 labels -->
  <text x="260" y="205" font-size="11" fill="#FF4B4B" font-weight="600" text-anchor="middle">木克土</text>
  <text x="175" y="210" font-size="11" fill="#FF4B4B" font-weight="600" text-anchor="middle">土克水</text>
  <text x="220" y="147" font-size="11" fill="#FF4B4B" font-weight="600" text-anchor="middle">水克火</text>
  <text x="255" y="240" font-size="11" fill="#FF4B4B" font-weight="600" text-anchor="middle">火克金</text>
  <text x="195" y="218" font-size="11" fill="#FF4B4B" font-weight="600" text-anchor="middle">金克木</text>

  <!-- Element circles -->
  <!-- 木 (top) -->
  <circle cx="220" cy="95" r="38" fill="#4CAF50" filter="url(#shadow)"/>
  <text x="220" y="100" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">木</text>

  <!-- 火 (upper-right) -->
  <circle cx="339" cy="170" r="38" fill="#FF5722" filter="url(#shadow)"/>
  <text x="339" y="175" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">火</text>

  <!-- 土 (lower-right) -->
  <circle cx="293" cy="321" r="38" fill="#8D6E63" filter="url(#shadow)"/>
  <text x="293" y="326" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">土</text>

  <!-- 金 (lower-left) -->
  <circle cx="147" cy="321" r="38" fill="#FFC107" filter="url(#shadow)"/>
  <text x="147" y="326" font-size="22" fill="#5D4037" font-weight="700" text-anchor="middle">金</text>

  <!-- 水 (upper-left) -->
  <circle cx="101" cy="170" r="38" fill="#2196F3" filter="url(#shadow)"/>
  <text x="101" y="175" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">水</text>

  <!-- Legend -->
  <rect x="310" y="370" width="12" height="12" rx="2" fill="#58CC02"/>
  <text x="326" y="381" font-size="11" fill="#666">相生</text>
  <line x1="360" y1="376" x2="390" y2="376" stroke="#FF4B4B" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="394" y="381" font-size="11" fill="#666">相克</text>
</svg>
