name: Sync to Gitee

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Push to Gitee
        run: |
          git remote add gitee "https://zweizweizwei:${{ secrets.GITEE_TOKEN }}@gitee.com/zweizweizwei/meihua-xuetang.git"
          git push gitee main --force
